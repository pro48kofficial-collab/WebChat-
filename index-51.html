/* перегляд і керування паком: власник додає/видаляє стікери, інші додають пак собі */
function packDialog(id){
  api('/api/pack/get?id='+encodeURIComponent(id)).then(function(r){
    if(!r.ok){toast(r.data.error||'Пак не знайдено');return}
    var p=r.data.pack,mine=p.owner===me.username,md=null;
    function grid(){
      return p.stickers.length?'<div class="pkgrid">'+p.stickers.map(function(s){
        return '<div class="sk" title="'+esc(s.e)+'"><span class="lz"'+lzAttr(s.id)+'></span>'+(mine?'<button type="button" class="x" data-rm="'+esc(s.id)+'" aria-label="Видалити стікер">×</button>':'')+'</div>'}).join('')+'</div>':
        '<div class="stat">У паку ще немає стікерів'+(mine?'. Додайте перший.':'.')+'</div>';
    }
    function draw(){
      var ins=!!packs[p.id];
      md.querySelector('.card').innerHTML='<h2>'+esc(p.title)+'</h2><div class="stat">'+esc(p.ownerName)+' · '+p.stickers.length+' стікерів</div>'+grid()+'<div class="err" id="pdE"></div>'+
        '<div class="acts" style="flex-wrap:wrap;justify-content:flex-start">'+
        (mine?'<button type="button" id="pdA">'+IC.plus+'Додати стікери</button><button type="button" id="pdR">Перейменувати</button><button type="button" class="dng" id="pdD">Видалити пак</button>':
          '<button type="button" class="pri" id="pdI">'+(ins?'Прибрати зі стікерів':'Додати стікери')+'</button>')+
        '<button type="button" id="pdL">Посилання</button><button type="button" id="pdX" style="margin-left:auto">Закрити</button></div>';
      var q=function(s){return md.querySelector(s)};
      q('#pdX').addEventListener('click',function(){md.remove()});
      q('#pdL').addEventListener('click',function(){copyText(packLink(p.id))});
      if(q('#pdI'))q('#pdI').addEventListener('click',function(){
        api(ins?'/api/pack/uninstall':'/api/pack/install',{packId:p.id}).then(function(x){
          if(!x.ok){q('#pdE').textContent=x.data.error||'Помилка';return}
          if(ins)dropPack(p.id);else setPack(x.data.pack);draw();
        });
      });
      if(q('#pdD'))q('#pdD').addEventListener('click',function(){
        if(this.dataset.sure!=='1'){this.dataset.sure='1';this.textContent='Точно видалити?';return}
        api('/api/pack/delete',{packId:p.id}).then(function(x){if(x.ok){dropPack(p.id);md.remove()}else q('#pdE').textContent=x.data.error||'Помилка'});
      });
      if(q('#pdR'))q('#pdR').addEventListener('click',function(){
        var t=prompt('Нова назва пакa',p.title);if(!t)return;
        api('/api/pack/update',{packId:p.id,title:t}).then(function(x){if(x.ok){p=Object.assign(p,x.data.pack);setPack(p);draw()}else q('#pdE').textContent=x.data.error||'Помилка'});
      });
      md.querySelectorAll('[data-rm]').forEach(function(b){b.addEventListener('click',function(){
        api('/api/pack/remove',{packId:p.id,id:b.dataset.rm}).then(function(x){if(x.ok){p=Object.assign(p,x.data.pack);setPack(p);draw()}else q('#pdE').textContent=x.data.error||'Помилка'});
      })});
      if(q('#pdA'))q('#pdA').addEventListener('click',function(){
        pickFile('image/png,image/jpeg,image/webp,image/gif',true,function(files){
          var e=q('#pdE'),left=Math.max(0,30-p.stickers.length);files=files.slice(0,left);
          if(!files.length){e.textContent='У паку може бути до 30 стікерів';return}
          e.className='err info';
          (function nxt(i){
            if(i>=files.length){e.className='err';e.textContent='';draw();return}
            e.textContent='Додаю стікер '+(i+1)+' з '+files.length+'…';
            stickerBlob(files[i]).then(function(b){
              return upload(b,b.type,'image','sticker:'+p.id).then(function(j){
                return api('/api/pack/add',{packId:p.id,mediaId:j.id,emoji:'🙂'}).then(function(x){
                  if(!x.ok)throw new Error(x.data.error||'Не вдалося додати');
                  urls[j.id]=URL.createObjectURL(b);cachePut(j.id,b);p=Object.assign(p,x.data.pack);setPack(p);
                });
              });
            }).then(function(){nxt(i+1)},function(er){e.className='err';e.textContent=er.message||'Помилка';draw()});
          })(0);
        });
      });
    }
    md=modal('');draw();
  });
}
function stickerBlob(file){
  var mime=guessMime(file);
  if(mime==='image/gif'){
    if(file.size>512*1024)return Promise.reject(new Error('GIF-стікер завеликий (до 512 КБ)'));
    return Promise.resolve(file);
  }
  return loadImage(file).then(function(im){
    var k=Math.min(1,512/Math.max(im.naturalWidth,im.naturalHeight));
    function go(){
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      return new Promise(function(res,rej){
        c.toBlob(function(b){
          if(!b){rej(new Error('Не вдалося обробити зображення'));return}
          if(b.size>500*1024&&k>.2){k*=.75;res(go());return}
          res(b);
        },'image/webp',.9);
      });
    }
    return go();
  });
}

if(token){boot()}else{$('#auth').hidden=false}
