<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<title>Vibe</title>
<style>
:root{
  --accent:#2f8be6; --bg:#ffffff; --panel:#ffffff; --panel-2:#f2f5f8; --line:#e3e8ee;
  --fg:#16202a; --muted:#7a8794; --chatbg:#dbe6ee; --in:#ffffff; --out:#dcf5c8; --out-meta:#5fa34a; --in-fg:#16202a;
  --danger:#e5484d; --online:#31b545; --badge:#2f8be6; --badge-mute:#aab4be;
  --shadow:0 4px 18px rgba(20,40,60,.16);
  --font:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#4ba3f5; --bg:#17212b; --panel:#17212b; --panel-2:#202b36; --line:#0e1621;
  --fg:#f1f5f9; --muted:#7f91a4; --chatbg:#0e1621; --in:#182533; --out:#2b5278; --out-meta:#9cc4ec; --in-fg:#f1f5f9;
  --danger:#ff6b70; --badge:#3b8fdc; --badge-mute:#4a5a6a; --shadow:0 4px 18px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#4ba3f5; --bg:#17212b; --panel:#17212b; --panel-2:#202b36; --line:#0e1621;
  --fg:#f1f5f9; --muted:#7f91a4; --chatbg:#0e1621; --in:#182533; --out:#2b5278; --out-meta:#9cc4ec; --in-fg:#f1f5f9;
  --danger:#ff6b70; --badge:#3b8fdc; --badge-mute:#4a5a6a; --shadow:0 4px 18px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
a{color:var(--accent)}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}

/* ===== вхід ===== */
#auth{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:linear-gradient(160deg,#2b6cb0,#4ba3f5 60%,#7cc4ff);overflow:auto}
.authcard{background:var(--panel);color:var(--fg);border-radius:20px;padding:26px 22px 22px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.logo{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:linear-gradient(135deg,#2f8be6,#7cc4ff);color:#fff}
.logo .ic{width:38px;height:38px;stroke:#fff}
.authcard h1{margin:0;text-align:center;font-size:26px;letter-spacing:-.02em}
.authcard p.lead{margin:4px 0 16px;text-align:center;color:var(--muted)}
.seg{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:13px;color:var(--muted);margin:0 2px 4px}
.field input{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;border-radius:10px;padding:11px 12px;outline:0}
.field input:focus{border-color:var(--accent)}
.primary{width:100%;background:var(--accent);color:#fff;border-radius:10px;padding:12px;font-weight:600;margin-top:6px}
.primary:disabled{opacity:.6}
.err{color:var(--danger);font-size:13.5px;min-height:18px;margin:6px 2px 0}
.hint{color:var(--muted);font-size:13px;margin:14px 2px 0;text-align:center}

/* ===== каркас ===== */
#app{height:100vh;height:100dvh;display:flex;overflow:hidden;position:relative}
.side{width:100%;display:flex;flex-direction:column;min-width:0;background:var(--panel);position:relative}
.main{display:none;flex:1;min-width:0;flex-direction:column;background:var(--chatbg);position:relative;overflow:hidden}
#app.chat-open .side{display:none}
#app.chat-open .main{display:flex}
@media (min-width:760px){
  .side{width:350px;flex:none;border-right:1px solid var(--line);display:flex!important}
  .main{display:flex!important}
  .back{display:none!important}
}
#wall,#dim{position:absolute;inset:0;pointer-events:none}
.top{display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 6px max(8px,env(safe-area-inset-left,0px))}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--panel-2)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel-2);border-radius:20px;padding:0 14px;height:38px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;outline:0}
.search input::placeholder{color:var(--muted)}
.search .ic{width:18px;height:18px}
.brand{font-weight:700;font-size:18px;color:var(--accent);padding:0 4px;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:10px 12px;font-weight:600;color:var(--muted);position:relative;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
.list{flex:1;overflow-y:auto;padding:4px 0 80px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 14px}
.row:hover{background:var(--panel-2)}
.row.active{background:var(--accent);color:#fff}
.row.active .prev,.row.active .time{color:rgba(255,255,255,.82)}
.row.active .prev b{color:#fff}
.row.active .badge{background:#fff;color:var(--accent)}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:18px;flex:none;position:relative}
.av.sm{width:40px;height:40px;font-size:15px}
.av .ic{stroke:#fff}
.av .dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--online);border:2.5px solid var(--panel)}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rline{display:flex;align-items:center;gap:6px;min-width:0}
.rname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.time{font-size:12.5px;color:var(--muted);flex:none;display:flex;align-items:center;gap:3px}
.prev{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.prev b{color:var(--accent);font-weight:500}
.prev .typing{color:var(--accent)}
.row.active .prev .typing{color:#fff}
.badge{background:var(--badge);color:#fff;border-radius:11px;min-width:22px;height:22px;padding:0 7px;font-size:12.5px;font-weight:600;display:grid;place-items:center;flex:none}
.pin{width:15px;height:15px;color:var(--muted);flex:none;transform:rotate(45deg)}
.empty-list{padding:40px 24px;text-align:center;color:var(--muted)}
.fab{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:var(--shadow);z-index:3}
.fab .ic{stroke:#fff}

/* ===== чат ===== */
.chatui{display:flex;flex-direction:column;flex:1;min-height:0;position:relative;z-index:1}
.nochat{flex:1;display:none;align-items:center;justify-content:center;position:relative;z-index:1}
@media (min-width:760px){#app:not(.chat-open) .nochat{display:flex}#app:not(.chat-open) .chatui{display:none}}
.welcome{text-align:center;color:#fff;padding:0 24px}
.welcome span{background:rgba(0,0,0,.32);padding:5px 14px;border-radius:14px;font-weight:500}
.head{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px 6px;background:var(--panel);border-bottom:1px solid var(--line);min-height:56px}
.hinfo{flex:1;min-width:0}
.hname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub.on{color:var(--accent)}
.msgs{flex:1;overflow-y:auto;padding:10px max(12px,env(safe-area-inset-right,0px)) 6px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain}
.day{align-self:center;margin:10px 0 6px;background:rgba(0,0,0,.32);color:#fff;font-size:12.5px;font-weight:500;padding:3px 11px;border-radius:12px}
.m{display:flex;max-width:min(82%,520px);min-width:0}
.m.out{align-self:flex-end}
.m.in{align-self:flex-start}
.m.gap{margin-top:6px}
.bub{background:var(--in);color:var(--in-fg);border-radius:16px;padding:6px 10px 5px;box-shadow:0 1px 1px rgba(0,0,0,.1);min-width:0;overflow-wrap:anywhere;position:relative;cursor:pointer}
.m.out .bub{background:var(--out)}
.m.out.last .bub{border-bottom-right-radius:4px}
.m.in.last .bub{border-bottom-left-radius:4px}
.auth{font-weight:600;font-size:13.5px;margin-bottom:1px}
.txt{white-space:pre-wrap}
.foot{float:right;margin:6px 0 -2px 10px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:2px;line-height:1}
.m.out .foot{color:var(--out-meta)}
.foot .ic{width:17px;height:17px;stroke-width:2}
.quote{border-left:3px solid var(--accent);background:rgba(47,139,230,.14);border-radius:4px 8px 8px 4px;padding:3px 8px;margin:2px 0 4px;font-size:13.5px;min-width:0}
.quote b{display:block;color:var(--accent);font-weight:600;font-size:13px}
.quote span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.tipbar{align-self:flex-start;display:flex;gap:4px;background:var(--in);border-radius:16px;border-bottom-left-radius:4px;padding:11px 13px;margin-top:4px}
.tipbar i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.1s infinite}
.tipbar i:nth-child(2){animation-delay:.15s}.tipbar i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion:reduce){.tipbar i{animation:none}}
.composer{background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.replybar{display:flex;align-items:center;gap:10px;padding:6px 8px 0 14px}
.replybar .quote{flex:1;margin:4px 0}
.cwrap{display:flex;align-items:flex-end;gap:4px;padding:6px 8px}
.cwrap textarea{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--fg);font:inherit;outline:0;max-height:140px;padding:9px 4px;line-height:1.35}
.cwrap textarea::placeholder{color:var(--muted)}
.sendbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--accent);flex:none}
.sendbtn.go{background:var(--accent);color:#fff}
.sendbtn.go .ic{stroke:#fff}

/* ===== меню, діалоги ===== */
.menu{position:fixed;z-index:20;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:190px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 12px;border-radius:8px}
.menu button:hover{background:var(--panel-2)}
.menu .ic{width:20px;height:20px;color:var(--muted)}
.menu .dng,.menu .dng .ic{color:var(--danger)}
.scrim{position:fixed;inset:0;z-index:19}
.modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;overflow:auto}
.card{background:var(--panel);border-radius:16px;padding:20px;width:100%;max-width:400px;box-shadow:var(--shadow);max-height:calc(100dvh - 32px);overflow-y:auto}
.card h2{margin:0 0 12px;font-size:18px}
.card h3{margin:18px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.card .acts button{padding:8px 14px;border-radius:8px;font-weight:600;color:var(--accent)}
.card .acts button.pri{background:var(--accent);color:#fff}
.tinput{width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--fg);font:inherit;border-radius:10px;padding:10px 12px;outline:0}
.tinput:focus{border-color:var(--accent)}
.ulist{margin:10px -8px 0;max-height:50vh;overflow-y:auto}
.uitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px;border-radius:10px}
.uitem:hover{background:var(--panel-2)}
.uitem small{display:block;color:var(--muted);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(20,30,40,.92);color:#fff;padding:8px 16px;border-radius:18px;z-index:60;font-size:14px;max-width:90vw;text-align:center}

/* ===== шпалери ===== */
.wpprev{position:relative;height:130px;border-radius:12px;overflow:hidden;margin-bottom:12px;background:var(--chatbg)}
.wpprev .pw,.wpprev .pd{position:absolute;inset:0}
.wpprev .pm{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-direction:column;gap:5px}
.wpprev .pm i{font-style:normal;padding:5px 10px;border-radius:12px;max-width:70%;font-size:13px;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.wpprev .pm .a{background:var(--in);color:var(--in-fg);align-self:flex-start}
.wpprev .pm .b{background:var(--out);color:var(--in-fg);align-self:flex-end}
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{aspect-ratio:1;border-radius:12px;border:2px solid transparent;position:relative;overflow:hidden;background:var(--chatbg);outline:1px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:600}
.wprow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn2{padding:9px 14px;border-radius:10px;background:var(--panel-2);font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn2:hover{background:var(--line)}
.btn2 input[type=color]{width:22px;height:22px;border:0;padding:0;background:none;border-radius:50%}
.range{display:flex;align-items:center;gap:12px;margin-top:12px}
.range label{width:88px;color:var(--muted);font-size:14px}
.range input{flex:1;min-width:0;accent-color:var(--accent)}
.range output{width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.themeseg{display:flex;gap:6px}
.themeseg button{flex:1;padding:9px;border-radius:10px;background:var(--panel-2);font-weight:600}
.themeseg button[aria-pressed="true"]{background:var(--accent);color:#fff}
/* ===== медіа ===== */
.av{background-size:cover;background-position:center}
.av.img{color:transparent}
.av.img .ic{opacity:0}
.mwrap{position:relative;border-radius:12px;overflow:hidden;margin:1px 0 4px;background-color:var(--panel-2);background-size:cover;background-position:center;width:min(72vw,280px);max-width:100%;cursor:pointer}
.mwrap .blur{position:absolute;inset:-12px;background-size:cover;background-position:center;filter:blur(10px)}
.mwrap img,.mwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.mwrap video{background:#000}
.mov{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
.mbtn{min-width:52px;height:52px;border-radius:26px;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;font-size:13px;font-weight:600}
.mbtn .ic{stroke:#fff;width:24px;height:24px}
.ring{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);display:grid;place-items:center;font-size:12px;font-weight:600;position:relative}
.ring svg{position:absolute;inset:4px;width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bg{stroke:rgba(255,255,255,.25)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .15s}
.mtag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;padding:2px 8px;border-radius:10px}
.txt.cap{display:block;margin-top:2px}
.viewer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.92);display:flex;flex-direction:column}
.viewer .vbar{display:flex;justify-content:flex-end;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
.viewer .vbar .iconbtn{color:#fff}
.viewer .vbar a{color:#fff;text-decoration:none}
.viewer .vimg{flex:1;min-height:0;display:grid;place-items:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.pvmedia{border-radius:12px;overflow:hidden;background:var(--panel-2);margin-bottom:10px;display:grid;place-items:center;max-height:45vh}
.pvmedia img,.pvmedia video{max-width:100%;max-height:45vh;display:block}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.attach input{display:none}
/* ===== реакції ===== */
.rxs{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 2px;clear:both}
.rx{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:12px;background:rgba(47,139,230,.14);font-size:13.5px;font-weight:600;cursor:pointer}
.rx.mine{background:var(--accent);color:#fff}
.rx .e{display:inline-block;font-size:15px;line-height:1}
.rx.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.rx[data-e="❤️"] .e{animation:beat 1.6s ease-in-out infinite}
.rx[data-e="🔥"] .e{animation:flick 1.2s ease-in-out infinite}
.rx[data-e="🎉"] .e{animation:wob 2s ease-in-out infinite}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.12,1.2) rotate(-5deg)}60%{transform:scale(.95,1.05) rotate(4deg)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.rxbar{display:flex;gap:2px;padding:4px 4px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.rxbar button{width:auto!important;padding:4px 5px!important;font-size:24px;border-radius:50%!important;transition:transform .12s}
.rxbar button:hover{transform:scale(1.3)}
.m{position:relative}
.fx{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:5}
.fx span{position:absolute;left:0;top:0;font-size:22px;line-height:1;opacity:0;animation:fly var(--d,1.3s) ease-out var(--dl,0s) forwards}
@keyframes fly{0%{opacity:0;transform:translate(0,0) scale(.4) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(var(--s,1)) rotate(var(--r,0deg))}}
.fx .big{font-size:56px;animation:bigpop 1s ease-out forwards}
@keyframes bigpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.3)}70%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}}
@media (prefers-reduced-motion:reduce){.rx .e,.rx.pop{animation:none!important}.fx{display:none}}
/* ===== профілі, канали, діалоги ===== */
.bigav{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;margin-bottom:6px}
.bigav .av{width:96px;height:96px;font-size:34px}
.bigav h2{margin:4px 0 0}
.bigav .sub{color:var(--muted);font-size:14px}
.bio{margin:10px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.music{display:flex;align-items:center;gap:12px;background:var(--panel-2);border-radius:14px;padding:10px 12px;margin-top:14px}
.music .pbtn{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none;color:#fff}
.music .pbtn .ic{stroke:#fff}
.music .mi{flex:1;min-width:0}
.music .mt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .ma{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .bar{margin-top:6px}
.bigbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px;border-radius:12px;background:var(--panel-2);margin-bottom:8px;font-weight:600}
.bigbtn:hover{background:var(--line)}
.bigbtn small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.bigbtn .ic{color:var(--accent);flex:none}
.seg2{display:flex;background:var(--panel-2);border-radius:10px;padding:3px;gap:3px;margin:8px 0}
.seg2 button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--panel-2);color:var(--muted);margin-left:6px;vertical-align:middle}
.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 2px 4px}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:13px;word-break:break-all}
.linkbox button{color:var(--accent);font-weight:600;flex:none}
.mrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:6px 4px;border-radius:10px}
.mrow:hover{background:var(--panel-2)}
.ro{padding:14px;text-align:center;color:var(--muted);font-weight:500}
textarea.tinput{resize:vertical;min-height:64px}
.dng{color:var(--danger)!important}
.who{display:flex;align-items:center;gap:12px}
.who b{display:block}.who small{color:var(--muted)}
/* ===== профіль, нижня навігація ===== */
.bnav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px));gap:2px}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--muted);font-size:11.5px;font-weight:600}
.bnav button .ic{width:24px;height:24px}
.bnav button[aria-current="true"]{color:var(--accent);background:rgba(47,139,230,.12)}
.bnav .bav{width:24px;height:24px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:700}
.fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))!important}
.pane{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.pane[hidden]{display:none!important}
.phead{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 8px;font-size:20px;font-weight:700}
.pf{padding:calc(12px + env(safe-area-inset-top,0px)) 14px 90px;display:flex;flex-direction:column;gap:12px}
.pfhead{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:6px 0 2px}
.pfhead .av{width:112px;height:112px;font-size:40px}
.pfhead h2{margin:8px 0 0;font-size:22px;overflow-wrap:anywhere}
.pfhead .sub{color:var(--muted);font-size:14px}
.pfhead .sub.on{color:var(--accent)}
.pfacts{display:flex;gap:8px}
.pfacts button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;background:var(--panel-2);font-size:13px;font-weight:600}
.pfacts button:hover{background:var(--line)}
.pfacts .ic{color:var(--fg)}
.pfcard{background:var(--panel-2);border-radius:16px;padding:4px 16px}
.pfrow{padding:12px 0;border-bottom:1px solid var(--line)}
.pfrow:last-child{border-bottom:0}
.pfrow .v{overflow-wrap:anywhere;white-space:pre-wrap}
.pfrow .k{color:var(--muted);font-size:13px;margin-top:2px}
.pfmusic{background:var(--panel-2);border-radius:16px;padding:12px}
.pfmusic .music{margin:0;padding:0;background:none}
.pfmusic .lbl{margin:0 0 8px}
.pfmusic .mrow2{display:flex;gap:8px;margin-top:10px}
.sheet{position:fixed;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column}
.sheethead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px;border-bottom:1px solid var(--line);font-weight:600}
.sheetbody{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto}
.members{max-height:34vh;overflow-y:auto;margin:6px -6px 0}
.err.info{color:var(--muted)}
.warn{background:rgba(229,72,77,.12);color:var(--danger);border-radius:10px;padding:8px 10px;font-size:13px;margin:0 0 10px}
.chip{display:inline-block;padding:1px 8px;border-radius:10px;background:var(--panel-2);color:var(--muted);font-size:12px;font-weight:600}
.sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.stat{color:var(--muted);font-size:14px;margin-top:6px}
/* ===== кеш-аватарки, закріплені, панель стікерів, голосові, опитування, коментарі ===== */
.lz{background-size:cover;background-position:center;background-repeat:no-repeat}
.pinbar{display:flex;align-items:center;gap:10px;padding:5px 6px 5px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:2}
.pinbar .pins{display:flex;flex-direction:column;gap:2px;height:30px;justify-content:center;width:3px}
.pinbar .pins i{flex:1;border-radius:2px;background:var(--line)}
.pinbar .pins i.on{background:var(--accent)}
.pinbar .ptxt{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;line-height:1.25}
.pinbar .ptxt b{color:var(--accent);font-size:13px}
.pinbar .ptxt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.m.flash .bub{animation:flashb 1.3s}
@keyframes flashb{0%,60%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 1px 1px rgba(0,0,0,.1)}}
.foot .pm{width:14px;height:14px;margin-right:3px;stroke-width:2}
.panel{border-top:1px solid var(--line)}
.pgrid{max-height:236px;overflow-y:auto;padding:6px 8px;display:grid;gap:2px}
.pgrid.e{grid-template-columns:repeat(8,1fr)}
.pgrid.e button{font-size:24px;border-radius:8px;padding:4px 0}
.pgrid.e button:hover{background:var(--panel-2)}
.pgrid.s{grid-template-columns:repeat(4,1fr);gap:6px}
.sk{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:40px;position:relative}
.sk:hover{background:var(--panel-2)}
.sk .lz{position:absolute;inset:4px;background-size:contain}
.ptabs{display:flex;gap:2px;padding:4px 6px;border-top:1px solid var(--line);overflow-x:auto}
.ptabs button{min-width:40px;height:36px;border-radius:8px;display:grid;place-items:center;font-size:20px;flex:none;position:relative;padding:0 6px}
.ptabs button.on{background:var(--panel-2)}
.ptabs .tabimg{position:absolute;inset:3px;background-size:contain}
.ptabs .ic{width:20px;height:20px}
.stk{width:150px;height:150px;background-size:contain}
.stk.e{font-size:92px;line-height:150px;width:auto;text-align:center}
.m.stkm .bub{background:none;box-shadow:none;padding:0}
.m.stkm .foot{background:rgba(0,0,0,.4);color:#fff;border-radius:10px;padding:2px 6px;float:none;position:absolute;right:4px;bottom:4px;margin:0}
.m.stkm .rxs{margin-top:2px}
.voice{display:flex;align-items:center;gap:10px;min-width:220px;padding:2px 0}
.vplay{width:42px;height:42px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:none;color:#fff}
.vplay .ic{stroke:#fff;width:20px;height:20px}
.vplay.ld{animation:vpulse 1s infinite}
.vwave{display:flex;align-items:center;gap:2px;height:28px;flex:1;cursor:pointer}
.vwave i{display:block;flex:1;min-width:2px;border-radius:2px;background:var(--muted);opacity:.5}
.vwave i.on{background:var(--accent);opacity:1}
.vdur{font-size:12.5px;color:var(--muted);min-width:34px;text-align:right}
@keyframes vpulse{50%{opacity:.35}}
.recbar{display:flex;align-items:center;gap:10px;padding:8px 10px}
.rdot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:vpulse 1s infinite}
.rhint{flex:1;color:var(--muted)}
.poll{min-width:230px;max-width:100%;padding:2px 0 0}
.poll .pq{font-weight:700}
.poll .pmeta{font-size:12.5px;color:var(--muted);margin:1px 0 6px}
.popt{display:flex;flex-direction:column;position:relative;width:100%;text-align:left;padding:6px 0 6px 30px;margin:2px 0;min-height:34px}
.popt .pk{position:absolute;left:0;top:8px;width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:12px;color:#fff;line-height:1}
.poll.multi .pk{border-radius:6px}
.popt.sel .pk{background:var(--accent);border-color:var(--accent)}
.popt.ok .pk{background:var(--online);border-color:var(--online)}
.popt.bad .pk{background:var(--danger);border-color:var(--danger)}
.popt .pr{display:flex;justify-content:space-between;gap:8px}
.popt .pn{font-weight:700;font-size:13px}
.popt .pb{height:5px;border-radius:3px;background:var(--panel-2);margin-top:4px;overflow:hidden}
.popt .pb i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
.popt.ok .pb i{background:var(--online)}
.popt.bad .pb i{background:var(--danger)}
.popt small{color:var(--muted);font-size:12px}
.pfoot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:6px;font-size:13px;color:var(--muted)}
.pfoot button{color:var(--accent);font-weight:600}
.pexpl{background:var(--panel-2);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:13.5px}
.plrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.plrow .plc{width:20px;height:20px;accent-color:var(--online);flex:none}
.plrow .tinput{flex:1;margin:0}
.cmbtn{display:flex;align-items:center;gap:8px;clear:both;width:calc(100% + 20px);margin:6px -10px -5px;padding:8px 10px;border-top:1px solid var(--line);color:var(--accent);font-weight:600;font-size:14px;border-radius:0 0 16px 16px}
.cmbtn .ic{width:20px;height:20px}
.cmbtn span{flex:1;text-align:left}
.cmsheet{position:fixed;inset:0;z-index:24;background:var(--chatbg);display:flex;flex-direction:column}
.cmsheet .sheethead{background:var(--panel)}
.cmbody{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:2px;max-width:640px;width:100%;margin:0 auto}
.cmpost{background:var(--in);border-radius:14px;padding:8px 12px;margin-bottom:6px;box-shadow:0 1px 1px rgba(0,0,0,.1);overflow-wrap:anywhere}
.cmpost b{color:var(--accent);display:block;font-size:13.5px}
.cmcount{align-self:center;background:rgba(0,0,0,.32);color:#fff;font-size:12.5px;padding:3px 11px;border-radius:12px;margin:6px 0}
.cmcomp{display:flex;align-items:flex-end;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line);width:100%}
.cmcomp textarea{flex:1;min-width:0;resize:none;border:0;background:none;color:var(--fg);font:inherit;outline:0;max-height:120px;padding:9px 4px}
.crav{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.crav .av{cursor:pointer}
.pkrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:6px 4px;border-radius:10px}
.pkrow:hover{background:var(--panel-2)}
.pkth{width:44px;height:44px;border-radius:10px;background-color:var(--panel-2);background-size:contain;flex:none;display:grid;place-items:center;font-weight:700}
.pkrow small{display:block;color:var(--muted)}
.pkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.pkgrid .sk{background-color:var(--panel-2)}
.pkgrid .sk .x{position:absolute;right:2px;top:2px;width:22px;height:22px;border-radius:50%;background:var(--danger);color:#fff;font-size:14px;line-height:22px;text-align:center}
/* ===== Новий вигляд Vibe: «сутінки». Фіолетово-кораловий акцент, плавучі панелі, закруглені квадрати замість кіл ===== */
:root{
  --accent:#7c5cff; --accent2:#ff5d8f; --grad:linear-gradient(135deg,#7c5cff,#ff5d8f);
  --bg:#f5f1ea; --panel:#fffdf9; --panel-2:#efe9df; --line:#e5ddd0;
  --fg:#231c30; --muted:#847b94; --chatbg:#ebe5da; --in:#ffffff; --out:#7c5cff; --out-meta:rgba(255,255,255,.78); --in-fg:#231c30;
  --danger:#e5484d; --online:#2fbf71; --badge:#ff5d8f; --badge-mute:#b6adc4;
  --shadow:0 8px 28px rgba(60,30,90,.16);
  --font:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#a18bff; --accent2:#ff7aa8; --grad:linear-gradient(135deg,#8b6cff,#ff6b9a);
  --bg:#120f1a; --panel:#1b1727; --panel-2:#262034; --line:#2e2742; --fg:#f4f0ff; --muted:#9b92b2;
  --chatbg:#0d0a14; --in:#272135; --in-fg:#f4f0ff; --out-meta:rgba(255,255,255,.72); --badge:#ff6b9a; --badge-mute:#4d4562;
  --shadow:0 10px 30px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{
  --accent:#a18bff; --accent2:#ff7aa8; --grad:linear-gradient(135deg,#8b6cff,#ff6b9a);
  --bg:#120f1a; --panel:#1b1727; --panel-2:#262034; --line:#2e2742; --fg:#f4f0ff; --muted:#9b92b2;
  --chatbg:#0d0a14; --in:#272135; --in-fg:#f4f0ff; --out-meta:rgba(255,255,255,.72); --badge:#ff6b9a; --badge-mute:#4d4562;
  --shadow:0 10px 30px rgba(0,0,0,.55)}
body{letter-spacing:.005em}
/* вхід */
#auth{background:radial-gradient(circle at 20% 15%,#ff7aa8 0,transparent 45%),radial-gradient(circle at 85% 80%,#5b8cff 0,transparent 50%),linear-gradient(160deg,#5b3df5,#9b4dff 55%,#ff6b9a)}
.authcard{border-radius:30px;padding:30px 24px 24px}
.logo{border-radius:30%;background:var(--grad);width:76px;height:76px;box-shadow:0 10px 24px rgba(124,92,255,.4)}
.seg,.seg2{border-radius:16px}.seg button,.seg2 button{border-radius:13px}
.field input,.tinput{border-radius:14px}
.primary,.card .acts button.pri,.themeseg button[aria-pressed="true"]{background:var(--grad);color:#fff;border-radius:14px}
.primary{padding:13px;box-shadow:0 8px 20px rgba(124,92,255,.35)}
/* каркас і список */
.side{background:var(--bg)}
@media (min-width:760px){.side{border-right:0;width:370px}}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.search{border-radius:16px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);height:42px}
.brand{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;font-size:21px;letter-spacing:-.03em}
.tabs{border-bottom:0;gap:8px;padding:6px 12px 10px}
.tab{padding:7px 15px;border-radius:999px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-size:14px}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);box-shadow:none}
.tab[aria-selected="true"]::after{display:none}
.list{padding:2px 0 100px}
.row{width:calc(100% - 20px);margin:0 10px 6px;padding:10px 12px;border-radius:22px;background:var(--panel);box-shadow:0 1px 0 var(--line)}
.row:hover{background:var(--panel)}
.row.active{background:var(--grad);box-shadow:0 8px 20px rgba(124,92,255,.3)}
.row.active .badge{background:#fff;color:var(--accent)}
.av{border-radius:34%}
.av .dot{right:-2px;bottom:-2px;border-color:var(--panel)}
.row.active .av .dot{border-color:#ff6b9a}
.badge{background:var(--grad);border-radius:12px}
.prev b{color:var(--accent);font-weight:600}
.fab{border-radius:22px;background:var(--grad);bottom:calc(92px + env(safe-area-inset-bottom,0px))!important;box-shadow:0 10px 24px rgba(124,92,255,.45)}
.bnav{margin:0 14px calc(10px + env(safe-area-inset-bottom,0px));padding:5px;border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);gap:4px}
.bnav button{border-radius:22px;padding:7px 2px}
.bnav button[aria-current="true"]{background:var(--grad);color:#fff}
.bnav .bav{border-radius:34%}
/* чат */
.head{margin:calc(8px + env(safe-area-inset-top,0px)) 10px 0;padding:6px 10px 6px 4px;border:1px solid var(--line);border-radius:24px;background:color-mix(in srgb,var(--panel) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 4px 16px rgba(40,20,70,.08);min-height:58px}
.hsub.on{color:var(--online)}
.pinbar{margin:6px 10px 0;border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 92%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.pinbar .pins i.on{background:var(--grad)}
.day{background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--muted);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:14px}
.welcome span{background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--muted);border:1px solid var(--line);border-radius:18px;padding:8px 18px}
.bub{border-radius:22px;padding:8px 13px 6px;box-shadow:0 1px 2px rgba(40,20,70,.08)}
.m.in .bub{border:1px solid var(--line)}
.m.out .bub{background:var(--grad);color:#fff;border:0;box-shadow:0 4px 14px rgba(124,92,255,.28)}
.m.out.last .bub{border-bottom-right-radius:7px}.m.in.last .bub{border-bottom-left-radius:7px}
.m.out .bub a{color:#fff;text-decoration:underline}
.m.out .quote{background:rgba(255,255,255,.18);border-left-color:#fff}.m.out .quote b{color:#fff}
.quote{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.rx{background:var(--panel-2);border-radius:14px}
.rx.mine{background:var(--grad);color:#fff}
.m.out .rx{background:rgba(255,255,255,.2);color:#fff}.m.out .rx.mine{background:#fff;color:var(--accent)}
.mwrap{border-radius:16px}
.m.out .vplay{background:#fff}.m.out .vplay .ic{stroke:var(--accent)}
.m.out .vwave i{background:#fff}.m.out .vwave i.on{background:#fff;opacity:1}.m.out .vwave i{opacity:.45}
.m.out .vdur,.m.out .pmeta,.m.out .pfoot,.m.out .popt small{color:rgba(255,255,255,.82)}
.m.out .pfoot button,.m.out .cmbtn{color:#fff}.m.out .cmbtn{border-top-color:rgba(255,255,255,.25)}
.m.out .popt .pk{border-color:rgba(255,255,255,.7)}.m.out .popt.sel .pk{background:#fff;color:var(--accent);border-color:#fff}
.m.out .popt .pb{background:rgba(255,255,255,.25)}.m.out .popt .pb i{background:#fff}
.m.out .pexpl{background:rgba(255,255,255,.18)}
.m.out .foot .ic{stroke:#fff}
.m.out.stkm .bub,.m.in.stkm .bub{background:none;border:0;box-shadow:none}
.vplay,.music .pbtn{background:var(--grad)}
.bar i,.popt .pb i{background:var(--grad)}
.popt.sel .pk{background:var(--accent)}
/* поле вводу */
.composer{background:none;border-top:0;padding:4px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.cwrap{background:var(--panel);border:1px solid var(--line);border-radius:28px;padding:4px 5px;box-shadow:var(--shadow)}
.cwrap .iconbtn{border-radius:18px}
.sendbtn{border-radius:19px}.sendbtn.go{background:var(--grad)}
.replybar{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:6px;padding:4px 6px 4px 12px}
.ro,.recbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.panel{margin-top:6px;overflow:hidden}
.ptabs button.on{background:var(--panel-2);border-radius:12px}
/* меню та діалоги */
.menu{border-radius:20px;padding:8px;border:1px solid var(--line)}
.menu button{border-radius:13px}
.modal{background:rgba(18,10,32,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{border-radius:28px;padding:22px}
.card .acts button{border-radius:14px}
.btn2,.pfacts button,.pfcard,.pfmusic,.bigbtn,.linkbox{border-radius:18px}
.music{border-radius:18px}
.toast{border-radius:16px;background:rgba(30,20,48,.94)}
.cmsheet,.sheet{background:var(--bg)}
.cmsheet .sheethead{background:var(--panel)}
.cmcount{background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.cmcomp{border-radius:24px 24px 0 0}
.chip,.tag{border-radius:999px}
.bnav button[aria-current="true"] .bav{box-shadow:0 0 0 2px #fff}
</style>
</head>
<body>

<!-- Вхід / реєстрація -->
<div id="auth" hidden>
  <form class="authcard" id="authForm" autocomplete="on">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg></div>
    <h1>Vibe</h1>
    <p class="lead">Швидкий месенджер від Clidex Studio</p>
    <div class="seg" role="group" aria-label="Режим">
      <button type="button" id="modeLogin" aria-pressed="true">Вхід</button>
      <button type="button" id="modeReg" aria-pressed="false">Реєстрація</button>
    </div>
    <label class="field"><span>Імʼя користувача</span><input id="aUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20" required></label>
    <label class="field"><span>Пароль</span><input id="aPass" name="password" type="password" autocomplete="current-password" minlength="6" maxlength="100" required></label>
    <div class="err" id="aErr" role="alert"></div>
    <button class="primary" id="aGo" type="submit">Увійти</button>
    <p class="hint">Заходите з іншого телефону? Оберіть «Вхід» і введіть своє імʼя та пароль. Чати, історія й шпалери підтягнуться автоматично.</p>
  </form>
</div>

<div id="app">
  <aside class="side">
    <div class="top">
      <button class="iconbtn" id="menuBtn" aria-label="Меню"><svg class="ic" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <label class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Пошук" autocomplete="off"></label>
      <span class="brand">Vibe</span>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button class="tab" role="tab" data-f="all" aria-selected="true">Усі</button>
      <button class="tab" role="tab" data-f="dm" aria-selected="false">Особисті</button>
      <button class="tab" role="tab" data-f="group" aria-selected="false">Групи</button>
      <button class="tab" role="tab" data-f="channel" aria-selected="false">Канали</button>
    </div>
    <div class="list" id="list"></div>
    <div class="pane" id="paneContacts" hidden><div class="phead">Контакти</div><div class="list" id="contactList"></div></div>
    <div class="pane" id="paneProfile" hidden></div>
    <button class="fab" id="newBtn" aria-label="Нова розмова"><svg class="ic" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
    <nav class="bnav" id="bnav" aria-label="Розділи">
      <button type="button" data-v="chats" aria-current="true"><svg class="ic" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg>Чати</button>
      <button type="button" data-v="contacts" aria-current="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Контакти</button>
      <button type="button" data-v="settings" aria-current="false"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Налаштування</button>
      <button type="button" data-v="profile" aria-current="false"><span class="bav" id="bnavAv"></span>Профіль</button>
    </nav>
  </aside>

  <section class="main" id="main">
    <div id="wall"></div><div id="dim"></div>
    <div class="nochat" id="nochat"><div class="welcome"><span>Оберіть чат, щоб почати спілкування</span></div></div>
    <div class="chatui" id="chatui" hidden>
      <header class="head">
        <button class="iconbtn back" id="backBtn" aria-label="Назад"><svg class="ic" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></svg></button>
        <button class="hbtn" id="hinfoBtn" type="button" aria-label="Інформація про чат" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left">
          <span id="hav"></span>
          <span class="hinfo"><div class="hname" id="hname"></div><div class="hsub" id="hsub"></div></span>
        </button>
        <button class="iconbtn" id="wpBtn" aria-label="Шпалери"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg></button>
      </header>
      <div class="pinbar" id="pinbar" hidden></div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <div class="replybar" id="replybar" hidden>
          <div class="quote"><b id="rbName"></b><span id="rbText"></span></div>
          <button class="iconbtn" id="rbClose" aria-label="Скасувати відповідь"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </div>
        <div class="ro" id="ro" hidden></div>
        <div class="cwrap" id="cwrap">
          <button class="iconbtn attach" id="attachBtn" type="button" aria-label="Прикріпити"><svg class="ic" viewBox="0 0 24 24"><path d="m21 11-8.6 8.6a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4L15 7.4"/></svg></button><input id="mediaIn" type="file" accept="image/*,video/*" hidden>
          <button class="iconbtn" id="emojiBtn" aria-label="Емодзі"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8.5 14a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg></button>
          <textarea id="inp" rows="1" placeholder="Повідомлення" aria-label="Повідомлення"></textarea>
          <button class="sendbtn" id="sendBtn" aria-label="Надіслати"><svg class="ic" viewBox="0 0 24 24" id="sendIc"></svg></button>
        </div>
        <div class="recbar" id="recbar" hidden><span class="rdot"></span><b id="recT">0:00</b><span class="rhint">Запис голосового…</span><button type="button" class="btn2" id="recX">Скасувати</button><button type="button" class="sendbtn go" id="recGo" aria-label="Надіслати"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12 20 4l-5 16-3-7Z"/><path d="m12 13 8-9"/></svg></button></div>
        <div class="panel" id="emoji" hidden><div class="pgrid e" id="pgrid"></div><div class="ptabs" id="ptabs"></div></div>
      </div>
    </div>
  </section>
</div>

<script>
(function(){
'use strict';
var TK='vibe.token', THK='vibe.theme', UK='vibe.user', LN='vibe.lastname', CK='vibe.cache.v1', DK='vibe.drafts.v1';
function wkey(){return 'vibe.wallpaper.'+(lsGet(UK)||'guest')}
var COLORS=[['#ff885e','#ff516a'],['#ffcd6a','#ffa85c'],['#82b1ff','#665fff'],['#a0de7e','#54cb68'],['#53edd6','#28c9b7'],['#72d5fd','#2a9ef1'],['#e0a2f3','#d669ed']];
var AUTHCOL=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
var EMOJIS=['😀','😂','😍','🥰','😎','🤔','😅','😭','🔥','👍','👏','🙏','🎉','❤️','💯','✨','🚀','💻','☕','🍕','🌈','👀','😴','🤝'];
var PRESETS=[
 {id:'aurora',name:'Аврора',css:'linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%)'},
 {id:'sunset',name:'Захід',css:'linear-gradient(160deg,#ff9966,#ff5e62 55%,#6a3093)'},
 {id:'ocean',name:'Океан',css:'linear-gradient(160deg,#2193b0,#6dd5ed)'},
 {id:'forest',name:'Ліс',css:'linear-gradient(150deg,#134e5e,#71b280)'},
 {id:'lavender',name:'Лаванда',css:'linear-gradient(150deg,#a18cd1,#fbc2eb)'},
 {id:'graphite',name:'Графіт',css:'linear-gradient(160deg,#232526,#414345)'},
 {id:'night',name:'Північ',css:'radial-gradient(circle at 30% 20%,#3a4a8c,transparent 55%),radial-gradient(circle at 80% 80%,#7a3a8c,transparent 55%),#0e1224'},
 {id:'dots',name:'Крапки',css:'radial-gradient(rgba(255,255,255,.2) 1.6px,transparent 1.7px) 0 0/22px 22px,linear-gradient(160deg,#3a6ea5,#2b4a78)'},
 {id:'mint',name:'Мʼята',css:'linear-gradient(150deg,#d4fc79,#96e6a1)'}
];
var $=function(s){return document.querySelector(s)};
var listEl=$('#list'),msgsEl=$('#msgs'),inp=$('#inp'),app=$('#app');

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

var token=lsGet(TK), me=null, users={}, msgs={}, reads={}, offset=0, active=null;
var extraDM={}, typing={}, filter='all', query='', replyTo=null, es=null, wasOpen=false, lastTyping=0, rooms={};
var RX=['❤️','👍','🔥','😂','😮','😢','🎉','👎'];
var pins={}, packs={}, cm=null, pollSel={}, pinIdx={}, panelTab='emoji';
var ID_RE=/^[a-f0-9]{32}$/;
function isId(s){return typeof s==='string'&&ID_RE.test(s)}

/* ---------- утиліти ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function linkify(s){return s.replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener noreferrer">'+u+'</a>'})}
function now(){return Date.now()+offset}
function hm(t){return new Date(t).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'})}
function dayKey(t){var d=new Date(t);return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate()}
function dayLabel(t){var n=Date.now();if(dayKey(t)===dayKey(n))return 'Сьогодні';if(dayKey(t)===dayKey(n-864e5))return 'Вчора';return new Date(t).toLocaleDateString('uk-UA',{day:'numeric',month:'long'})}
function listTime(t){var n=Date.now();if(dayKey(t)===dayKey(n))return hm(t);if(n-t<6*864e5)return new Date(t).toLocaleDateString('uk-UA',{weekday:'short'});return new Date(t).toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'})}
function ini(name){var p=name.trim().split(/[\s_.]+/);return ((p[0]||'?')[0]+(p[1]?p[1][0]:'')).toUpperCase()}
function authColor(name){var h=0;for(var i=0;i<name.length;i++)h+=name.charCodeAt(i);return AUTHCOL[h%AUTHCOL.length]}
function plural(n){var a=n%10,b=n%100;if(a===1&&b!==11)return 'учасник';if(a>=2&&a<=4&&(b<12||b>14))return 'учасники';return 'учасників'}
function toast(t){document.querySelectorAll('.toast').forEach(function(x){x.remove()});var e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},2200)}
var IC={
 reply:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a7 7 0 0 1 7 7v3"/></svg>',
 copy:'<svg class="ic" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
 del:'<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
 plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 img:'<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>',
 out:'<svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
 users:'<svg class="ic" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M18 14.5A6 6 0 0 1 21 20"/></svg>'
};

/* ---------- мережа ---------- */
function api(path,body){
  var opt={method:body?'POST':'GET',headers:{'Content-Type':'application/json'}};
  if(token)opt.headers.Authorization='Bearer '+token;
  if(body)opt.body=JSON.stringify(body);
  return fetch(path,opt).then(function(r){
    return r.json().catch(function(){return {}}).then(function(j){
      if(r.status===401&&token&&path.indexOf('/api/login')<0&&path.indexOf('/api/register')<0)logout(true);
      return {ok:r.ok,status:r.status,data:j};
    });
  },function(){return {ok:false,status:0,data:{error:'Немає звʼязку з сервером'}}});
}

/* ---------- вхід ---------- */
var mode='login';
function setMode(m){
  mode=m;
  $('#modeLogin').setAttribute('aria-pressed',m==='login');
  $('#modeReg').setAttribute('aria-pressed',m==='reg');
  $('#aGo').textContent=m==='login'?'Увійти':'Створити акаунт';
  $('#aPass').setAttribute('autocomplete',m==='login'?'current-password':'new-password');
  $('#aErr').textContent='';
}
$('#modeLogin').addEventListener('click',function(){setMode('login')});
$('#modeReg').addEventListener('click',function(){setMode('reg')});
$('#authForm').addEventListener('submit',function(e){
  e.preventDefault();
  var b=$('#aGo');b.disabled=true;$('#aErr').className='err info';$('#aErr').textContent='Підключення… Якщо сервер спав, це може тривати до хвилини';
  api(mode==='login'?'/api/login':'/api/register',{username:$('#aUser').value,password:$('#aPass').value}).then(function(r){
    b.disabled=false;
    $('#aErr').className='err';
    if(!r.ok){$('#aErr').textContent=r.data.error||'Помилка';return}else $('#aErr').textContent='';
    token=r.data.token;lsSet(TK,token);lsSet(UK,r.data.me.username);lsSet(LN,r.data.me.name);$('#aPass').value='';
    wp=loadWp();applyWp();drafts=loadDrafts();
    $('#auth').hidden=true;boot();
  });
});
function logout(silent){
  if(!silent&&token)api('/api/logout',{});
  token=null;lsDel(TK);lsDel(CK);lsDel(DK);lsDel(UK);me=null;users={};msgs={};reads={};pins={};packs={};closeComments();active=null;extraDM={};typing={};drafts={};
  wp=loadWp();applyWp();clearMediaCache();closeSheets();if(bgAudio){bgAudio.pause();bgId=null}setView('chats');
  if(es){es.close();es=null}
  $('#aUser').value=lsGet(LN)||'';
  app.classList.remove('chat-open');$('#chatui').hidden=true;$('#nochat').style.display='';
  document.title='Vibe';
  $('#auth').hidden=false;
  if(silent)$('#aErr').textContent='Сесію завершено, увійдіть знову';
}

/* ---------- стан ---------- */
/* локальна копія на телефоні: чати відкриваються миттєво, історія видна навіть без звʼязку */
var cacheTimer=null;
function saveCache(){
  if(cacheTimer||!me)return;
  cacheTimer=setTimeout(function(){
    cacheTimer=null;if(!me)return;
    var m={};Object.keys(msgs).forEach(function(k){m[k]=msgs[k].slice(-60)});
    lsSet(CK,JSON.stringify({me:me,users:users,rooms:rooms,msgs:m,reads:reads,offset:offset,pins:pins,packs:packs}));
  },800);
}
function loadCache(){
  try{var c=JSON.parse(lsGet(CK));if(c&&c.me&&c.me.username===lsGet(UK))return c}catch(e){}
  return null;
}
var drafts=loadDrafts(),draftTimer=null;
function loadDrafts(){try{var d=JSON.parse(lsGet(DK));if(d&&typeof d==='object')return d}catch(e){}return {}}
function saveDraft(){
  if(!active)return;
  if(inp.value)drafts[active]=inp.value;else delete drafts[active];
  if(draftTimer)clearTimeout(draftTimer);
  draftTimer=setTimeout(function(){lsSet(DK,JSON.stringify(drafts))},400);
}
function adoptSettings(s){
  var w=s&&s.wallpaper;
  if(w&&w.kind){
    wp={kind:w.kind,id:w.id||'',value:w.value||'',dim:+w.dim||0,blur:+w.blur||0};
    lsSet(wkey(),JSON.stringify(wp));applyWp();
  } else if(wp.kind!=='default'||wp.dim||wp.blur){pushSettings()}
}
var pushTimer=null,warned=false;
function pushSettings(){
  if(!token)return;
  if(pushTimer)clearTimeout(pushTimer);
  pushTimer=setTimeout(function(){
    if(wp.kind==='image'&&!isId(wp.value))return;
    api('/api/settings',{wallpaper:wp});
  },700);
}
function boot(){
  if(!me){
    var c=loadCache();
    if(c){me=c.me;users=c.users||{};rooms=c.rooms||{};msgs=c.msgs||{};reads=c.reads||{};offset=c.offset||0;pins=c.pins||{};packs=c.packs||{};renderList()}
  }
  api('/api/state').then(function(r){
    if(!r.ok){
      if(r.status===0){toast(me?'Немає звʼязку. Показую збережені дані':r.data.error);setTimeout(boot,4000)}
      return;
    }
    applyState(r.data);
    adoptSettings(r.data.settings);migrateWp();
    renderList();updateTitle();
    if(active){renderHead();renderMsgs(false)}
    connect();
    checkJoinLink();setTimeout(healServer,2500);
  });
}
function applyState(d){
  me=d.me;users={};d.users.forEach(function(u){users[u.username]=u});
  rooms={};(d.rooms||[]).forEach(function(r){rooms[r.id]=r});
  msgs={};d.messages.forEach(function(m){(msgs[m.chatId]=msgs[m.chatId]||[]).push(m)});
  reads=d.reads||{};offset=d.now-Date.now();
  pins=d.pins||{};packs={};(d.packs||[]).forEach(function(p){packs[p.id]=p});
}
function connect(){
  if(es)es.close();
  es=new EventSource('/api/stream?token='+encodeURIComponent(token));
  es.addEventListener('open',function(){if(wasOpen)resync();wasOpen=true});
  es.addEventListener('msg',function(e){onMsg(JSON.parse(e.data))});
  es.addEventListener('del',function(e){
    var d=JSON.parse(e.data);
    if(d.parent){if(cm&&cm.post.id===d.parent){cm.list=cm.list.filter(function(m){return m.id!==d.id});drawComments()}return}
    var a=msgs[d.chatId];if(a)msgs[d.chatId]=a.filter(function(m){return m.id!==d.id});
    if(cm&&cm.post.id===d.id)closeComments();
    if(pins[d.chatId]){pins[d.chatId]=pins[d.chatId].filter(function(x){return x!==d.id});if(!pins[d.chatId].length)delete pins[d.chatId]}
    if(active===d.chatId){renderMsgs();renderPin()}renderList();
  });
  es.addEventListener('read',function(e){var d=JSON.parse(e.data);reads[d.chatId]=reads[d.chatId]||{};reads[d.chatId][d.user]=d.t;if(active===d.chatId)renderMsgs();renderList()});
  es.addEventListener('typing',function(e){onTyping(JSON.parse(e.data))});
  es.addEventListener('presence',function(e){var d=JSON.parse(e.data);if(users[d.username]){users[d.username].online=d.online;if(d.lastSeen)users[d.username].lastSeen=d.lastSeen}renderList();if(active)renderHead()});
  es.addEventListener('user',function(e){var u=JSON.parse(e.data);users[u.username]=u;if(me&&u.username===me.username)me=u;renderList();refreshProfiles();if(active){renderHead();renderMsgs()}});
  es.addEventListener('room',function(e){var r=JSON.parse(e.data);rooms[r.id]=r;renderList();if(active===r.id){renderHead();renderComposer()}});
  es.addEventListener('roomdel',function(e){
    var d=JSON.parse(e.data);delete rooms[d.id];delete msgs[d.id];
    if(active===d.id){active=null;closeChat(true);toast('Чат більше недоступний')}
    renderList();updateTitle();
  });
  es.addEventListener('react',function(e){onReact(JSON.parse(e.data))});
  es.addEventListener('poll',function(e){var d=JSON.parse(e.data),m=findIn(d.chatId,d.id);if(m){m.poll=d.poll;if(active===d.chatId)renderMsgs()}});
  es.addEventListener('want',function(e){var d=JSON.parse(e.data);restoreOne(d.id)});
  es.addEventListener('pins',function(e){var d=JSON.parse(e.data);setPins(d.chatId,d.pins)});
  es.addEventListener('cc',function(e){var d=JSON.parse(e.data),m=findIn(d.chatId,d.id);if(m){m.cc=d.n;if(active===d.chatId)renderMsgs()}});
  es.addEventListener('error',function(){
    if(es&&es.readyState===2){
      api('/api/state').then(function(r){if(r.status===0)setTimeout(connect,4000);else if(r.ok)connect()});

/* ---------- медіа: кеш на телефоні ---------- */
var MC='vibe-media-v1', urls={}, loading={}, progress={};
function cacheOK(){try{return typeof caches!=='undefined'}catch(e){return false}}
function mediaUrl(id){return '/api/media/'+id}
function fmtSize(n){return n<1048576?Math.max(1,Math.round(n/1024))+' КБ':(n/1048576).toFixed(1)+' МБ'}
function fmtDur(s){s=Math.round(s||0);return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2)}
function autoPhotos(){return lsGet('vibe.autophoto')!=='0'}
function cachePut(id,b){
  if(!cacheOK())return;
  caches.open(MC).then(function(c){return c.put(mediaUrl(id),new Response(b,{headers:{'Content-Type':b.type||'application/octet-stream','Content-Length':String(b.size)}}))}).catch(function(){});
}
function getCached(id){
  if(urls[id])return Promise.resolve(urls[id]);
  if(!cacheOK())return Promise.resolve(null);
  return caches.open(MC).then(function(c){return c.match(mediaUrl(id))}).then(function(r){
    if(!r)return null;
    return r.blob().then(function(b){urls[id]=URL.createObjectURL(b);return urls[id]});
  }).catch(function(){return null});
}
function download(id){
  if(loading[id])return loading[id];
  progress[id]=0;
  var p=fetch(mediaUrl(id),{headers:{Authorization:'Bearer '+token}}).then(function(r){
    if(!r.ok){var er=new Error('http '+r.status);er.status=r.status;throw er}
    var total=+r.headers.get('content-length')||0,type=r.headers.get('content-type')||'';
    if(!r.body||!r.body.getReader)return r.blob();
    var rd=r.body.getReader(),chunks=[],got=0;
    function pump(){return rd.read().then(function(x){
      if(x.done)return new Blob(chunks,{type:type});
      chunks.push(x.value);got+=x.value.length;if(total)setProgress(id,got/total);
      return pump();
    })}
    return pump();
  }).then(function(b){urls[id]=URL.createObjectURL(b);cachePut(id,b);return urls[id]});
  loading[id]=p;
  var done=function(){delete loading[id];delete progress[id]};
  p.then(done,done);
  return p;
}
function cacheStats(cb){
  if(!cacheOK()){cb(0,0);return}
  caches.open(MC).then(function(c){return c.keys().then(function(ks){
    return Promise.all(ks.map(function(k){return c.match(k).then(function(r){return r?(+r.headers.get('content-length')||0):0})})).then(function(sz){
      cb(ks.length,sz.reduce(function(a,b){return a+b},0));
    });
  })}).catch(function(){cb(0,0)});
}
function clearMediaCache(cb){
  Object.keys(urls).forEach(function(k){try{URL.revokeObjectURL(urls[k])}catch(e){}});
  urls={};
  (cacheOK()?caches.delete(MC):Promise.resolve()).then(function(){cb&&cb()},function(){cb&&cb()});
}

/* ---------- показ медіа в повідомленнях ---------- */
function ringHtml(f){
  var c=119.4;
  return '<div class="mov"><div class="ring"><svg viewBox="0 0 44 44"><circle class="bg" cx="22" cy="22" r="19"/><circle class="fg" cx="22" cy="22" r="19" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-f)).toFixed(1)+'"/></svg><span>'+Math.round(f*100)+'%</span></div></div>';
}
function setProgress(id,f){
  progress[id]=f;
  document.querySelectorAll('.mwrap[data-media="'+id+'"] .mslot').forEach(function(s){s.innerHTML=ringHtml(f)});
}
function findMsg(id){var a=msgs[active]||[];for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function showMedia(w,d,u){
  var slot=w.querySelector('.mslot');if(!slot)return;
  if(d.kind==='image'){
    slot.innerHTML='<img alt="Фото" src="'+u+'">';
    var im=slot.firstChild;im.onload=function(){var b=w.querySelector('.blur');if(b)b.remove()};
  } else {
    slot.innerHTML='<video src="'+u+'" playsinline controls preload="metadata"></video>';

function showDownloadBtn(w,d,failed,gone){
  var slot=w.querySelector('.mslot');if(!slot)return;
  var label=(gone?'Недоступно · повторити · ':(failed?'Повторити · ':''))+fmtSize(d.size);
  slot.innerHTML='<div class="mov"><button class="mbtn" type="button" data-dl="1">'+IC.dl+'<span>'+label+'</span></button></div>'+
    (d.kind==='video'&&d.dur?'<span class="mtag">'+fmtDur(d.dur)+'</span>':'');

function startDownload(d){
  var sel='.mwrap[data-media="'+d.id+'"]';
  document.querySelectorAll(sel+' .mslot').forEach(function(s){s.innerHTML=ringHtml(progress[d.id]||0)});
  download(d.id).then(function(u){
    document.querySelectorAll(sel).forEach(function(w){showMedia(w,d,u)});
  },function(err){
    var gone=!!(err&&err.status===404);
    document.querySelectorAll(sel).forEach(function(w){showDownloadBtn(w,d,true,gone)});
    /* сервер просить телефони, що мають файл у кеші, повернути його: пробуємо ще кілька разів */
    if(gone&&(d._r=(d._r||0)+1)<=3&&active)setTimeout(function(){if(!urls[d.id]&&!loading[d.id])startDownload(d)},4000);

function hydrateMedia(){
  msgsEl.querySelectorAll('.mwrap').forEach(function(w){
    var m=findMsg(w.dataset.mm);if(!m||!m.media)return;

/* ---------- надсилання фото й відео ---------- */
function guessMime(file){
  if(file.type)return file.type.toLowerCase();
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  return {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',webp:'image/webp',mp4:'video/mp4',mov:'video/quicktime',webm:'video/webm',
    mp3:'audio/mpeg',m4a:'audio/mp4',aac:'audio/aac',ogg:'audio/ogg',wav:'audio/wav'}[ext]||'';
}
function loadImage(file){
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(u);res(im)};
    im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Не вдалося відкрити фото. Якщо це формат HEIC, зробіть знімок у JPEG'))};
    im.src=u;
  });
}
function canvasBlob(c,q){
  return new Promise(function(res,rej){c.toBlob(function(b){b?res(b):rej(new Error('Не вдалося стиснути фото'))},'image/jpeg',q)});
}
function thumbOf(src,sw,sh){
  var k=Math.min(1,32/Math.max(sw,sh)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  var g=c.getContext('2d');g.fillStyle='#888';g.fillRect(0,0,c.width,c.height);g.drawImage(src,0,0,c.width,c.height);
  var t=c.toDataURL('image/jpeg',.4);
  return t.length<3900?t:'';
}
function prepImage(file,mime){
  if(mime==='image/gif'){
    if(file.size>8*1048576)return Promise.reject(new Error('GIF завеликий (до 8 МБ)'));
    return loadImage(file).then(function(im){return {blob:file,mime:mime,w:im.naturalWidth,h:im.naturalHeight,dur:0,thumb:thumbOf(im,im.naturalWidth,im.naturalHeight),url:URL.createObjectURL(file)}});
  }
  return loadImage(file).then(function(im){
    var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1600/Math.max(w,h));
    var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
    var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    return canvasBlob(c,.84).then(function(b){
      return {blob:b,mime:'image/jpeg',w:c.width,h:c.height,dur:0,thumb:thumbOf(im,w,h),url:URL.createObjectURL(b)};
    });
  });
}
function prepVideo(file,mime){
  if(file.size>25*1048576)return Promise.reject(new Error('Відео завелике (до 25 МБ). Оберіть коротший ролик'));
  return new Promise(function(res,rej){
    var u=URL.createObjectURL(file),v=document.createElement('video');
    v.preload='metadata';v.muted=true;v.playsInline=true;
    var fin=false;
    function done(extra){
      if(fin)return;fin=true;
      res({blob:file,mime:mime,w:v.videoWidth||640,h:v.videoHeight||360,dur:isFinite(v.duration)?v.duration:0,thumb:extra||'',url:u});
    }
    v.onerror=function(){if(!fin){fin=true;URL.revokeObjectURL(u);rej(new Error('Не вдалося прочитати відео'))}};
    v.onloadedmetadata=function(){try{v.currentTime=Math.min(.2,(v.duration||1)/2)}catch(e){done()}};
    v.onseeked=function(){var t='';try{t=thumbOf(v,v.videoWidth,v.videoHeight)}catch(e){}done(t)};
    setTimeout(function(){if(v.videoWidth||v.duration)done();else if(!fin){fin=true;rej(new Error('Не вдалося прочитати відео'))}},6000);
    v.src=u;
  });
}
function upload(blob,mime,kind,chatId,onp){
  return new Promise(function(res,rej){
    var x=new XMLHttpRequest();
    x.open('POST','/api/media?kind='+kind+'&chatId='+encodeURIComponent(chatId));
    x.setRequestHeader('Authorization','Bearer '+token);
    x.setRequestHeader('Content-Type',mime);
    x.upload.onprogress=function(e){if(e.lengthComputable&&onp)onp(e.loaded/e.total)};
    x.onload=function(){
      var j={};try{j=JSON.parse(x.responseText)}catch(e){}
      if(x.status===200)res(j);
      else rej(new Error(j.error||(x.status===413?'Файл завеликий':'Помилка завантаження ('+x.status+')')));
    };
    x.onerror=function(){rej(new Error('Немає звʼязку з сервером'))};
    x.ontimeout=function(){rej(new Error('Час очікування вичерпано'))};
    x.timeout=180000;
    x.send(blob);
  });
}
function attachDialog(file){
  var chatId=active;if(!chatId)return;
  var mime=guessMime(file),kind=mime.indexOf('video/')===0?'video':(mime.indexOf('image/')===0?'image':'');
  if(!kind||!/^(image\/(jpeg|png|gif|webp|heic|heif)|video\/(mp4|quicktime|webm))$/.test(mime)){toast('Підтримуються фото та відео (MP4, MOV, WebM)');return}
  var md=modal('<h2>'+(kind==='video'?'Надіслати відео':'Надіслати фото')+'</h2><div class="pvmedia" id="pvm"><span style="padding:30px;color:var(--muted)">Обробка…</span></div>'+
    '<input class="tinput" id="pvCap" maxlength="1000" placeholder="Підпис (необовʼязково)" value="'+esc(inp.value)+'">'+
    '<div class="bar" id="pvBar" hidden><i></i></div><div class="err" id="pvErr"></div>'+
    '<div class="acts"><button type="button" id="pvX">Скасувати</button><button type="button" class="pri" id="pvGo" disabled>Надіслати</button></div>');
  var prepared=null,busy=false;
  function fail(m){md.querySelector('#pvErr').textContent=m;busy=false;md.querySelector('#pvGo').disabled=!prepared;md.querySelector('#pvBar').hidden=true}
  (kind==='video'?prepVideo(file,mime):prepImage(file,mime)).then(function(p){
    prepared=p;
    md.querySelector('#pvm').innerHTML=kind==='video'?'<video src="'+p.url+'" playsinline controls preload="metadata"></video>':'<img alt="" src="'+p.url+'">';
    md.querySelector('#pvGo').disabled=false;
  },function(e){md.querySelector('#pvm').innerHTML='';fail(e.message)});
  md.querySelector('#pvX').addEventListener('click',function(){if(!busy)md.remove()});
  md.querySelector('#pvGo').addEventListener('click',function(){
    if(!prepared||busy)return;busy=true;
    var go=md.querySelector('#pvGo'),bar=md.querySelector('#pvBar');
    go.disabled=true;bar.hidden=false;md.querySelector('#pvErr').textContent='';
    var cap=md.querySelector('#pvCap').value.trim();
    upload(prepared.blob,prepared.mime,kind,chatId,function(f){bar.firstChild.style.width=Math.round(f*100)+'%'}).then(function(j){
      var body={chatId:chatId,text:cap,media:{id:j.id,w:prepared.w,h:prepared.h,dur:Math.round(prepared.dur||0),thumb:prepared.thumb}};
      if(replyTo&&active===chatId)body.reply=replyTo;
      return api('/api/send',body).then(function(r){
        if(!r.ok)throw new Error(r.data.error||'Не вдалося надіслати');
        urls[j.id]=prepared.url;cachePut(j.id,prepared.blob);
        addMsg(r.data.message);
        if(inp.value===md.querySelector('#pvCap').defaultValue){inp.value='';autosize();updateSend();saveDraft()}
        replyTo=null;$('#replybar').hidden=true;
        md.remove();
        if(active===chatId)renderMsgs(true);renderList();
      });
    }).catch(function(e){fail(e.message||'Помилка')});
  });
}

var lastTap={id:'',t:0,timer:null};
function msgPick(e){
  if(e.target.closest('a')||e.target.closest('video'))return;
  var mEl=e.target.closest('.m');if(!mEl)return;
  var m=findMsg(mEl.dataset.mid);if(!m)return;
  if(e.target.closest('.mbtn[data-dl]')){if(m.media)startDownload(m.media);return}
  var vo=e.target.closest('.voice');
  if(vo){if(e.target.closest('[data-v="seek"]')&&vSeek(vo,e))return;vToggle(vo);return}
  var pb=e.target.closest('.poll [data-pi]');if(pb){pollClick(m,+pb.dataset.pi);return}
  var pa=e.target.closest('.poll [data-pa]');if(pa){pollAction(m,pa.dataset.pa);return}
  if(e.target.closest('[data-cm]')){openComments(m);return}
  var chip=e.target.closest('.rx');if(chip){react(m,chip.dataset.e);return}
  if(e.target.closest('.auth')){openProfile(m.from);return}
  var img=e.target.closest('.mwrap img');if(img){openViewer(img.src);return}
  var now=Date.now();
  if(lastTap.id===m.id&&now-lastTap.t<350){clearTimeout(lastTap.timer);lastTap.id='';closePopup();react(m,'❤️');return}
  clearTimeout(lastTap.timer);

function roomLink(r){
  if(r.isPublic&&r.handle)return location.origin+'/?join=%40'+r.handle;
  return r.invite?location.origin+'/?join='+encodeURIComponent(r.invite):'';
}
function copyText(t){
  try{navigator.clipboard.writeText(t).then(function(){toast('Скопійовано')},function(){toast('Не вдалося скопіювати')})}catch(e){toast('Не вдалося скопіювати')}
}
function refreshState(cb){
  api('/api/state').then(function(r){if(r.ok){applyState(r.data);renderList();updateTitle();if(active){renderHead();renderComposer();renderMsgs()}}cb&&cb(r.ok)});
}
function openRoom(id){
  closeSheets();

  refreshState(function(){if(rooms[id])open(id)});
}
function joinRoom(payload,md){

/* Якщо файл зник із сервера (кеш на диску обмежений), телефон, що його має, повертає його назад.
   Сервер перевіряє SHA-256, тому підмінити файл не можна. */
function knownIds(){
  var s={};
  Object.keys(users).forEach(function(k){var x=users[k];if(isId(x.avatar))s[x.avatar]=1;if(x.music&&isId(x.music.mediaId))s[x.music.mediaId]=1});
  Object.keys(rooms).forEach(function(k){if(isId(rooms[k].avatar))s[rooms[k].avatar]=1});
  Object.keys(msgs).forEach(function(k){msgs[k].forEach(function(m){if(m.media)s[m.media.id]=1;if(m.sticker&&m.sticker.pack!=='vibe')s[m.sticker.id]=1})});
  Object.keys(packs).forEach(function(k){packs[k].stickers.forEach(function(x){s[x.id]=1})});
  if(wp.kind==='image'&&isId(wp.value))s[wp.value]=1;
  return Object.keys(s);
}
function healServer(){
  if(!cacheOK()||!token)return;
  Promise.all(knownIds().map(function(id){return cacheBlob(id).then(function(b){return b?id:null})})).then(function(have){
    have=have.filter(Boolean);
    (function next(){
      var chunk=have.splice(0,50);if(!chunk.length)return;
      api('/api/media/missing',{ids:chunk}).then(function(r){
        var miss=(r.data&&r.data.missing)||[];
        (function up(){
          var id=miss.shift();if(!id)return next();
          cacheBlob(id).then(function(b){
            return b?fetch('/api/media/restore?id='+id,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/octet-stream'},body:b}):null;
          }).then(up,up);
        })();
      });
    })();
  });
}

  });
}
function dataUrlToBlob(u){
  var m=/^data:([^;]+);base64,(.*)$/.exec(u);if(!m)return null;
  var bin=atob(m[2]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
  return new Blob([a],{type:m[1]});
}

function squareBlob(file,size){
  return loadImage(file).then(function(im){
    var s=Math.min(im.naturalWidth,im.naturalHeight),sx=(im.naturalWidth-s)/2,sy=(im.naturalHeight-s)/2,q=.86,sz=size||256;
    function go(){
      var c=document.createElement('canvas');c.width=c.height=sz;
      var g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,sz,sz);g.drawImage(im,sx,sy,s,s,0,0,sz,sz);
      return canvasBlob(c,q).then(function(b){if(b.size>240*1024&&sz>96){if(q>.55)q-=.12;else sz=Math.round(sz*.8);return go()}return b});
    }
    return go();
  });
}
function wallBlob(file){
  return loadImage(file).then(function(im){
    var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1280/Math.max(w,h)),q=.82;
    function go(){
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
      var g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
      return canvasBlob(c,q).then(function(b){if(b.size>1.1*1048576){if(q>.55)q-=.1;else k*=.8;return go()}return b});
    }
    return go();
  });
}

    var f=act&&tot?Math.min(1,vAudio.currentTime/tot):0;

  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    var mt='',T=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'];
    for(var i=0;i<T.length;i++){try{if(MediaRecorder.isTypeSupported(T[i])){mt=T[i];break}}catch(e){}}
    var mr;try{mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(function(t){t.stop()});toast('Не вдалося почати запис');return}
    var r=rec={mr:mr,stream:stream,chunks:[],t0:Date.now(),amps:[],chat:active,cancel:false,ctx:null,an:null,timer:null,sampler:null};
    mr.ondataavailable=function(e){if(e.data&&e.data.size)r.chunks.push(e.data)};
    mr.onstop=function(){finishRec(r)};
    try{
      var AC=window.AudioContext||window.webkitAudioContext;r.ctx=new AC();
      var src=r.ctx.createMediaStreamSource(stream);r.an=r.ctx.createAnalyser();r.an.fftSize=512;src.connect(r.an);
      var buf=new Uint8Array(r.an.fftSize);
      r.sampler=setInterval(function(){r.an.getByteTimeDomainData(buf);var mx=0;for(var k=0;k<buf.length;k++){var v=Math.abs(buf[k]-128);if(v>mx)mx=v}r.amps.push(mx/128)},100);
    }catch(e){}
    mr.start(250);
    $('#emoji').hidden=true;$('#cwrap').hidden=true;$('#recbar').hidden=false;$('#recT').textContent='0:00';
    r.timer=setInterval(function(){
      var s=(Date.now()-r.t0)/1000;$('#recT').textContent=fmtDur(s);
      if(s>=300)stopRec(false);
    },200);
  },function(){toast('Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера')});
}
function stopRec(cancel){
  var r=rec;if(!r)return;
  r.cancel=cancel;clearInterval(r.timer);clearInterval(r.sampler);
  try{if(r.mr.state!=='inactive')r.mr.stop();else finishRec(r)}catch(e){finishRec(r)}
  r.stream.getTracks().forEach(function(t){t.stop()});
}
function finishRec(r){
  if(rec!==r)return;
  rec=null;try{if(r.ctx)r.ctx.close()}catch(e){}
  $('#recbar').hidden=true;if(active){var c=info(active);$('#cwrap').hidden=!!c.readonly}
  if(r.cancel)return;
  var dur=(Date.now()-r.t0)/1000;
  if(dur<.8||!r.chunks.length){toast('Занадто коротко, затримайтесь довше');return}
  var mime=(r.mr.mimeType||'audio/webm').split(';')[0];
  if(mime.indexOf('audio/')!==0)mime='audio/webm';
  var blob=new Blob(r.chunks,{type:mime});
  var mx=0;r.amps.forEach(function(a){if(a>mx)mx=a});
  var wave=[],n=48;
  for(var i=0;i<n;i++){
    var a=r.amps.length?r.amps[Math.min(r.amps.length-1,Math.floor(i*r.amps.length/n))]:0;
    wave.push(mx>0?Math.max(1,Math.round(Math.pow(a/mx,.7)*31)):4);
  }
  var chatId=r.chat;toast('Надсилаю голосове…');
  upload(blob,mime,'audio',chatId).then(function(j){
    var body={chatId:chatId,media:{id:j.id,dur:Math.min(600,Math.round(dur)),wave:wave}};
    return api('/api/send',body).then(function(x){
      if(!x.ok)throw new Error(x.data.error||'Не вдалося надіслати');
      urls[j.id]=URL.createObjectURL(blob);cachePut(j.id,blob);
      addMsg(x.data.message);if(active===chatId)renderMsgs(true);renderList();
    });
  }).catch(function(e){toast(e.message||'Не вдалося надіслати голосове')});
}

  p.options.forEach(function(o,i){
    var cls='popt',mark='',show=o.n!==null;
    var chosen=sel.indexOf(i)>=0;
    if(p.quiz&&p.correct!==undefined){
      if(i===p.correct){cls+=' ok';mark='✓'}else if(chosen){cls+=' bad';mark='✕'}
    } else if(chosen){cls+=' sel';mark='✓'}
    var pct=show&&p.total?Math.round(o.n*100/p.total):0;
    var who=p.who&&p.who[i]&&p.who[i].length?'<small>'+esc(p.who[i].slice(0,3).join(', '))+(p.who[i].length>3?' +'+(p.who[i].length-3):'')+'</small>':'';

      (show?'<span class="pb"><i style="width:'+pct+'%"></i></span>':'')+who+'</button>';
  });
  if(p.quiz&&p.expl&&p.correct!==undefined)h+='<div class="pexpl">💡 '+esc(p.expl)+'</div>';
  var act='';
  if(!p.closed){
    if(p.multi&&(pollSel[m.id]||[]).length)act+='<button type="button" data-pa="send">Проголосувати</button>';
    if(p.voted&&!p.quiz)act+='<button type="button" data-pa="retract">Скасувати голос</button>';

function vote(m,opts){

    m.poll=r.data.poll;delete pollSel[m.id];renderMsgs();
  });
}
function pollClick(m,i){
  var p=m.poll;if(!p||p.closed)return;
  if(p.quiz){if(!p.voted)vote(m,[i]);return}
  if(p.multi){
    var s=pollSel[m.id]=(pollSel[m.id]||p.mine.slice()),k=s.indexOf(i);
    if(k>=0)s.splice(k,1);else s.push(i);
    renderMsgs();return;
  }
  if(p.voted&&p.mine[0]===i)vote(m,[]);else vote(m,[i]);
}
function pollAction(m,a){
  if(a==='send')vote(m,pollSel[m.id]||[]);

    api('/api/poll/close',{id:m.id}).then(function(r){if(r.ok){m.poll=r.data.poll;renderMsgs()}else toast(r.data.error||'Не вдалося завершити')});
