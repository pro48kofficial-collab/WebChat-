<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebChat</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" class="auth-screen">
  <div class="auth-card">
    <div class="logo-mark">W</div><h1>WebChat</h1><p>Спілкуйся, підписуйся, створюй.</p>
    <label class="gallery-avatar"><img id="regAvatar" src="https://i.imgur.com/6VBx3io.png"><span>📷 Обрати з галереї</span><input id="regFile" type="file" accept="image/*"></label>
    <input id="regUser" placeholder="@юзернейм" maxlength="32"><input id="regNick" placeholder="Ім'я або нікнейм" maxlength="60">
    <button class="primary" id="loginBtn">Увійти</button><div id="authError" class="error"></div>
    <button class="owner-link" id="ownerOpenAuth">Панель власника</button>
  </div>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="topbar"><div class="me" id="profileBtn"><div class="avatar-wrap"><img id="myAvatar"><span class="online-dot"></span></div><div class="me-text"><b id="myNick"></b><small id="myUser"></small></div></div><button class="icon-btn" id="menuBtn">☰</button></div>
    <div class="searchbar"><span>🔎</span><input id="search" placeholder="Пошук"><button id="searchBtn">➤</button></div>
    <div id="searchResult"></div>
    <div class="quick-actions"><button onclick="openCreate('channel')">📢 Канал</button><button onclick="openCreate('group')">👥 Чат</button></div>
    <div class="section-title">ЧАТИ</div><div id="chats" class="chat-list"></div>
    <div class="bottom-nav"><button id="shopBtn">💎<small>Магазин</small></button><button id="ownerBtn">🛡️<small>Власник</small></button><button id="profileBottom">👤<small>Профіль</small></button></div>
  </aside>
  <main id="main" class="main">
    <header id="header" class="chat-header"><button id="back" class="back-btn">‹</button><div id="headerAvatar" class="header-avatar"></div><div id="headerInfo" class="header-info"><b>WebChat</b><small>Оберіть чат або знайдіть користувача</small></div><div id="headerActions" class="header-actions hidden"><button id="audioCall" class="icon-btn" title="Аудіодзвінок">📞</button><button id="videoCall" class="icon-btn" title="Відеодзвінок">📹</button></div><button id="headerMore" class="icon-btn">⋮</button></header>
    <div id="feed" class="feed"><div class="empty-state"><div>💬</div><b>Ваші повідомлення</b><span>Знайдіть людину або канал через пошук</span></div></div>
    <div id="composer" class="composer hidden"><input id="attach" type="file" hidden accept="image/*,video/*"><input id="cameraInput" type="file" hidden accept="image/*" capture="environment"><button id="cameraBtn" class="round-btn" title="Камера">📷</button><button id="attachBtn" class="round-btn" title="Галерея">📎</button><button id="voice" class="round-btn">🎙️</button><input id="msg" placeholder="Повідомлення..."><button id="send" class="send-btn">➤</button></div>
  </main>
</div>
<div id="modal" class="modal-layer hidden"><div id="modalContent" class="modal-card"></div></div>
<div id="incomingCallLayer" class="call-layer hidden"><div class="incoming-call-card"><div id="incomingCallAvatar" class="incoming-avatar"></div><h2 id="incomingCallTitle">Вхідний дзвінок</h2><div id="incomingCallType">📞 Аудіодзвінок</div><div class="incoming-actions"><button id="rejectCall" class="end-call">Відхилити</button><button id="acceptCall" class="accept-call">Прийняти</button></div></div></div>
<div id="callLayer" class="call-layer hidden"><div class="call-card"><div id="callTitle" class="call-title">Дзвінок</div><video id="remoteVideo" class="remote-video" autoplay playsinline></video><video id="localVideo" class="local-video" autoplay muted playsinline></video><div id="callStatus" class="call-status">Підключення…</div><div class="call-controls"><button id="muteCall">🎙️</button><button id="cameraCall">📷</button><button id="endCall" class="end-call">📞</button></div></div></div>
<div id="liveLayer" class="call-layer hidden"><div class="call-card live-card"><div id="liveTitle" class="call-title">📺 Трансляція</div><video id="liveVideo" class="remote-video" autoplay playsinline controls></video><div id="liveStatus" class="call-status">Підключення до трансляції…</div><div class="call-controls"><button id="stopLive" class="end-call">Завершити</button></div></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
