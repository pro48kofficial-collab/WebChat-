<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebChat Mobile</title> 
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: #090d16; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .phone-frame {
            width: 100%;
            max-width: 430px;
            height: 100%;
            max-height: 932px;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        @media (min-width: 431px) {
            .phone-frame {
                border-radius: 40px;
                border: 10px solid #1e293b;
                height: 90vh;
            }
        }

        #auth-screen { position: absolute; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .auth-card { background: #1e293b; padding: 25px; border-radius: 20px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px; }
        .auth-card h2 { text-align: center; color: #38bdf8; margin-bottom: 5px; }
        .auth-card input, .auth-card textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
        .auth-card textarea { resize: none; height: 70px; }
        .auth-card button { width: 100%; padding: 12px; background: #38bdf8; border: none; border-radius: 10px; color: #0f172a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        .avatar-picker { display: flex; gap: 10px; align-items: center; }
        .avatar-picker img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #38bdf8; flex-shrink: 0; }
        .file-btn-small { background: #334155; color: #38bdf8; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .app-container { display: flex; width: 100%; height: 100%; position: relative; overflow: hidden; }
        
        .view-panel { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0f172a; transition: transform 0.3s ease; }
        #sidebar-view { transform: translateX(0); z-index: 2; }
        #chat-view { transform: translateX(100%); z-index: 3; background: #0b132b; }
        
        .app-container.chat-active #sidebar-view { transform: translateX(-30%); }
        .app-container.chat-active #chat-view { transform: translateX(0); }

        .sidebar-header { padding: 15px; display: flex; gap: 10px; align-items: center; background: #1e293b; border-bottom: 1px solid #334155; }
        .search-input { flex: 1; padding: 10px 15px; background: #0f172a; border: 1px solid #334155; border-radius: 20px; color: #fff; outline: none; font-size: 14px; }
        .create-channel-btn { background: #10b981; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: bold; flex-shrink: 0; }
        
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 15px; cursor: pointer; border-bottom: 1px solid rgba(51, 65, 85, 0.3); }
        .chat-item:active { background: #273548; }
        
        .user-avatar-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
        .user-avatar-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .status-dot { position: absolute; bottom: 2px; right: 2px; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #1e293b; background: #64748b; }
        .status-dot.online { background: #22c55e; }

        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 15px; margin-bottom: 3px; display: flex; justify-content: space-between; color: #fff; }
        .chat-last-msg { font-size: 13px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .my-profile-bar { padding: 12px 15px; background: #1e293b; display: flex; align-items: center; gap: 10px; border-top: 1px solid #334155; cursor: pointer; }
        .my-profile-bar img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }

        .chat-header { padding: 12px 15px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; }
        .chat-header-info { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; overflow: hidden; }
        .chat-header-info img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .chat-header-text { overflow: hidden; }
        .chat-header-title { font-weight: bold; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-status { font-size: 11px; color: #94a3b8; }
        
        .back-btn { background: none; border: none; color: #38bdf8; font-size: 20px; cursor: pointer; padding-right: 5px; display: flex; align-items: center; }
        .chat-header-actions { display: flex; gap: 8px; }
        .action-btn { background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 18px; padding: 5px; }

        .messages-container { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 12px; border-radius: 12px; font-size: 14px; position: relative; line-height: 1.4; word-break: break-word; }
        .message.incoming { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.outgoing { background: #0284c7; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
        .msg-meta { display: flex; justify-content: flex-end; gap: 4px; font-size: 10px; color: #cbd5e1; margin-top: 3px; }

        .reactions-bar { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .reaction-badge { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 3px; border: 1px solid rgba(255,255,255,0.1); }
        .add-reaction-btn { background: none; border: none; color: #94a3b8; font-size: 12px; cursor: pointer; padding: 2px 4px; border-radius: 8px; }
        
        .reaction-picker { position: absolute; background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 5px 10px; display: flex; gap: 6px; z-index: 50; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; }
        .reaction-picker span { cursor: pointer; font-size: 16px; transition: transform 0.1s; }
        .reaction-picker span:hover { transform: scale(1.3); }

        .chat-input-panel { padding: 10px 15px; background: #1e293b; border-top: 1px solid #334155; display: flex; align-items: center; gap: 8px; }
        .chat-input-panel textarea { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 20px; padding: 10px 14px; color: #fff; outline: none; resize: none; height: 40px; max-height: 100px; font-size: 14px; }
        .file-upload-label { cursor: pointer; font-size: 20px; color: #94a3b8; padding: 5px; }
        .send-btn { background: #38bdf8; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #0f172a; font-weight: bold; cursor: pointer; flex-shrink: 0; }

        .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 2000; display: none; padding: 20px; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 16px; width: 100%; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .modal-content h3 { color: #38bdf8; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-size: 13px; outline: none; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
        .modal-buttons button { padding: 8px 16px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #334155; color: #fff; }
        .btn-save { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- Екран авторизації -->
        <div id="auth-screen">
            <div class="auth-card">
                <h2>WebChat</h2>
                <p style="font-size: 12px; color: #94a3b8; text-align: center;">Мобільний месенджер</p>
                <div class="avatar-picker">
                    <img id="preview-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
                    <input type="file" id="auth-file-input" style="display: none;" accept="image/*" onchange="handleImageUpload(this, 'preview-avatar', 'input-avatar')">
                    <button class="file-btn-small" type="button" onclick="document.getElementById('auth-file-input').click()">З галереї</button>
                    <input type="hidden" id="input-avatar" value="https://i.imgur.com/6VBx3io.png">
                </div>
                <input type="text" id="input-username" placeholder="Юзернейм (@tag)">
                <input type="text" id="input-displayname" placeholder="Твоє ім'я">
                <textarea id="input-bio" placeholder="Про себе..."></textarea>
                <button type="button" onclick="saveProfileAndEnter()">Увійти</button>
            </div>
        </div>

        <!-- Основний додаток -->
        <div class="app-container" id="main-app" style="display: none;">
            
            <div class="view-panel" id="sidebar-view">
                <div class="sidebar-header">
                    <input type="text" class="search-input" id="search-box" placeholder="Пошук (@tag)..." oninput="handleSearch()">
                    <button class="create-channel-btn" type="button" onclick="openChannelModal()">+ Канал</button>
                </div>
                <div class="chats-list" id="chats-list"></div>
                <div class="my-profile-bar" onclick="openProfileModal()">
                    <img id="sidebar-my-avatar" src="" alt="">
                    <div class="chat-info">
                        <div class="chat-name" id="sidebar-my-name">Профіль</div>
                        <div class="chat-last-msg" id="sidebar-my-tag">@tag</div>
                    </div>
                </div>
            </div>

            <div class="view-panel" id="chat-view">
                <div class="chat-header">
                    <button class="back-btn" type="button" onclick="closeChat()">‹</button>
                    <div class="chat-header-info">
                        <img id="active-avatar" src="" alt="">
                        <div class="chat-header-text">
                            <div class="chat-header-title" id="active-title">Чат</div>
                            <div class="chat-header-status" id="active-status">онлайн</div>
                        </div>
                    </div>
                    <div class="chat-header-actions" id="chat-actions-bar"></div>
                </div>

                <div class="messages-container" id="messages-container"></div>

                <div class="chat-input-panel" id="chat-input-panel">
                    <label class="file-upload-label" for="file-input">📎</label>
                    <input type="file" id="file-input" style="display: none;" accept="image/*" onchange="sendFile(this)">
                    <textarea id="message-input" placeholder="Повідомлення..." maxlength="5000" onkeydown="handleKey(event)"></textarea>
                    <button class="send-btn" type="button" onclick="sendMessage()">➤</button>
                </div>
            </div>

        </div>
    </div>

    <!-- Вибір реакцій -->
    <div class="reaction-picker" id="reaction-picker">
        <span onclick="addReaction('❤️')">❤️</span>
        <span onclick="addReaction('👍')">👍</span>
        <span onclick="addReaction('👎')">👎</span>
        <span onclick="addReaction('😢')">😢</span>
        <span onclick="addReaction('🔥')">🔥</span>
        <span onclick="addReaction('💩')">💩</span>
    </div>

    <!-- Модальне вікно профілю -->
    <div class="modal" id="profile-modal">
        <div class="modal-content">
            <h3>Мій профіль</h3>
            <div class="avatar-picker">
                <img id="edit-preview-avatar" src="" alt="Avatar">
                <input type="file" id="profile-file-input" style="display: none;" accept="image/*" onchange="handleImageUpload(this, 'edit-preview-avatar', 'edit-avatar')">
                <button class="file-btn-small" type="button" onclick="document.getElementById('profile-file-input').click()">З галереї</button>
                <input type="hidden" id="edit-avatar">
            </div>
            <input type="text" id="edit-displayname" placeholder="Ім'я">
            <textarea id="edit-bio" placeholder="Опис"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" type="button" onclick="closeModals()">Скасувати</button>
                <button class="btn-save" type="button" onclick="updateMyProfile()">Зберегти</button>
            </div>
        </div>
    </div>

    <!-- Модальне вікно створення/редагування каналу -->
    <div class="modal" id="channel-modal">
        <div class="modal-content">
            <h3 id="channel-modal-title">Створити канал</h3>
            <input type="text" id="channel-tag" placeholder="Посилання (@channel)">
            <input type="text" id="channel-name" placeholder="Назва каналу">
            <div class="avatar-picker">
                <img id="channel-preview-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Avatar">
                <input type="file" id="channel-file-input" style="display: none;" accept="image/*" onchange="handleImageUpload(this, 'channel-preview-avatar', 'channel-avatar')">
                <button class="file-btn-small" type="button" onclick="document.getElementById('channel-file-input').click()">З галереї</button>
                <input type="hidden" id="channel-avatar" value="https://i.imgur.com/6VBx3io.png">
            </div>
            <div class="modal-buttons">
                <button class="btn-cancel" type="button" onclick="closeModals()">Скасувати</button>
                <button class="btn-save" id="channel-save-btn" type="button" onclick="saveChannel()">Створити</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = JSON.parse(localStorage.getItem('webchat_user')) || null;
        let activeChat = null; 
        let myChats = JSON.parse(localStorage.getItem('webchat_my_chats')) || [];
        let channels = JSON.parse(localStorage.getItem('webchat_channels')) || [];
        let searchResults = [];
        let selectedMsgForReaction = null;
        let editingChannelId = null;

        if (currentUser) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            initApp();
        }

        function handleImageUpload(input, previewImgId, hiddenInputId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById(previewImgId).src = e.target.result;
                    document.getElementById(hiddenInputId).value = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        }

        function sanitizeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function saveProfileAndEnter() {
            const username = document.getElementById('input-username').value.trim();
            const displayName = document.getElementById('input-displayname').value.trim();
            const avatar = document.getElementById('input-avatar').value;
            const bio = document.getElementById('input-bio').value.trim();

            if (!username || !displayName) return alert('Введіть юзернейм та ім\'я!');

            currentUser = {
    id: username.toLowerCase().startsWith('@') ? username.toLowerCase() : '@' + username.toLowerCase(),
    username: username.startsWith('@') ? username : '@' + username,
    displayName,
    avatar: avatar || 'https://i.imgur.com/6VBx3io.png',
    bio
};
         
            localStorage.setItem('webchat_user', JSON.stringify(currentUser));
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'flex';
            socket.emit('set profile', currentUser);
            initApp();
        }

        function initApp() {
            document.getElementById('sidebar-my-avatar').src = currentUser.avatar;
            document.getElementById('sidebar-my-name').innerText = currentUser.displayName;
            document.getElementById('sidebar-my-tag').innerText = currentUser.username;
            renderChatsList();
            socket.emit('get all users');
        }

        function renderChatsList() {
            const container = document.getElementById('chats-list');
            container.innerHTML = '';
            const searchVal = document.getElementById('search-box').value.trim();
            
            if (searchVal) {
                if (searchResults.length === 0) {
                    container.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b; font-size: 13px;">Нікого не знайдено</div>';
                    return;
                }
                searchResults.forEach(item => renderChatElement(item, container, true));
                return;
            }

            const allItems = [...myChats, ...channels];
            if (allItems.length === 0) {
                container.innerHTML = '<div style="padding: 20px; text-align: center; color: #64748b; font-size: 13px;">Немає чатів. Знайдіть юзера або канал через пошук!</div>';
                return;
            }

            allItems.forEach(item => renderChatElement(item, container, false));
        }

        function renderChatElement(item, container, isSearchResult) {
            const el = document.createElement('div');
            el.className = 'chat-item';
            el.onclick = () => {
                if (item.type === 'user' || !item.type) {
    // Формуємо унікальний, але стабільний ID кімнати для вас двох
    const ids = [currentUser.id, item.id].sort();
    const stableChatId = 'chat_' + ids[0].replace('@', '') + '_' + ids[1].replace('@', '');

    let found = myChats.find(c => c.id === stableChatId);
    if (!found) {
        found = { 
            type: 'user', 
            id: stableChatId, // Постійний ID кімнати
            displayName: item.displayName || item.name, 
            username: item.username, 
            avatar: item.avatar, 
            online: item.online 
        };
        myChats.push(found);
        localStorage.setItem('webchat_my_chats', JSON.stringify(myChats));
    }
    openChat(found);
                }
                } else {
                    let foundChan = channels.find(c => c.id === item.id);
                    if (!foundChan) {
                        channels.push(item);
                        localStorage.setItem('webchat_channels', JSON.stringify(channels));
                    }
                    openChat(item);
                }
            };

            const isOnline = item.online ? 'online' : '';
            el.innerHTML = `
                <div class="user-avatar-wrap">
                    <img src="${item.avatar || 'https://i.imgur.com/6VBx3io.png'}" alt="">
                    ${item.type !== 'channel' ? `<div class="status-dot ${isOnline}"></div>` : ''}
                </div>
                <div class="chat-info">
                    <div class="chat-name">${sanitizeHTML(item.displayName || item.name || '')}</div>
                    <div class="chat-last-msg">${sanitizeHTML(item.username || '')}</div>
                </div>
            `;
            container.appendChild(el);
        }

        function handleSearch() {
            const query = document.getElementById('search-box').value.trim().toLowerCase();
            if (!query) {
                searchResults = [];
                renderChatsList();
                return;
            }
            socket.emit('search users', query);
        }

        socket.on('search results', (results) => {
            searchResults = results.filter(u => u.id !== currentUser.id);
            renderChatsList();
        });

        function openChat(chat) {
            activeChat = chat;
            document.querySelector('.app-container').classList.add('chat-active');
            document.getElementById('active-title').innerText = chat.displayName || chat.name;
            document.getElementById('active-avatar').src = chat.avatar || 'https://i.imgur.com/6VBx3io.png';
            document.getElementById('active-status').innerText = chat.username || '';
            document.getElementById('messages-container').innerHTML = '';
            
            const actionsBar = document.getElementById('chat-actions-bar');
            actionsBar.innerHTML = '';

            const inputPanel = document.getElementById('chat-input-panel');

            if (chat.type === 'channel') {
                const isAdmin = chat.adminId === currentUser.id;
                if (isAdmin) {
                    actionsBar.innerHTML = `<button class="action-btn" type="button" onclick="openEditChannelModal()">✏️</button>`;
                    inputPanel.style.display = 'flex';
                } else {
                    inputPanel.style.display = 'none';
                }
            } else {
                inputPanel.style.display = 'flex';
            }

            socket.emit('join chat', chat.id);
        }

        function closeChat() {
            document.querySelector('.app-container').classList.remove('chat-active');
            activeChat = null;
        }

        function openProfileModal() { 
            document.getElementById('edit-preview-avatar').src = currentUser.avatar;
            document.getElementById('edit-avatar').value = currentUser.avatar;
            document.getElementById('edit-displayname').value = currentUser.displayName;
            document.getElementById('edit-bio').value = currentUser.bio || '';
            document.getElementById('profile-modal').style.display = 'flex'; 
        }

        function openChannelModal() {
            editingChannelId = null;
            document.getElementById('channel-modal-title').innerText = 'Створити канал';
            document.getElementById('channel-save-btn').innerText = 'Створити';
            document.getElementById('channel-tag').value = '';
            document.getElementById('channel-name').value = '';
            document.getElementById('channel-preview-avatar').src = 'https://i.imgur.com/6VBx3io.png';
            document.getElementById('channel-avatar').value = 'https://i.imgur.com/6VBx3io.png';
            document.getElementById('channel-modal').style.display = 'flex';
        }

        function openEditChannelModal() {
            if (!activeChat || activeChat.type !== 'channel') return;
            editingChannelId = activeChat.id;
            document.getElementById('channel-modal-title').innerText = 'Редагувати канал';
            document.getElementById('channel-save-btn').innerText = 'Зберегти';
            document.getElementById('channel-tag').value = activeChat.username;
            document.getElementById('channel-name').value = activeChat.name;
            document.getElementById('channel-preview-avatar').src = activeChat.avatar;
            document.getElementById('channel-avatar').value = activeChat.avatar;
            document.getElementById('channel-modal').style.display = 'flex';
        }

        function closeModals() { 
            document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); 
            document.getElementById('reaction-picker').style.display = 'none';
        }

        function updateMyProfile() {
            currentUser.avatar = document.getElementById('edit-avatar').value;
            currentUser.displayName = document.getElementById('edit-displayname').value;
            currentUser.bio = document.getElementById('edit-bio').value;
            localStorage.setItem('webchat_user', JSON.stringify(currentUser));
            closeModals();
            initApp();
            socket.emit('set profile', currentUser);
        }

        function saveChannel() {
            const name = document.getElementById('channel-name').value.trim();
            const tag = document.getElementById('channel-tag').value.trim();
            const avatar = document.getElementById('channel-avatar').value;

            if (!name || !tag) return alert('Заповніть назву та посилання каналу!');

            const formattedTag = tag.startsWith('@') ? tag : '@' + tag;

            if (editingChannelId) {
                let chan = channels.find(c => c.id === editingChannelId);
                if (chan) {
                    chan.name = name;
                    chan.username = formattedTag;
                    chan.avatar = avatar;
                    localStorage.setItem('webchat_channels', JSON.stringify(channels));
                    
                    if (activeChat && activeChat.id === editingChannelId) {
                        activeChat.name = name;
                        activeChat.username = formattedTag;
                        activeChat.avatar = avatar;
                        document.getElementById('active-title').innerText = name;
                        document.getElementById('active-avatar').src = avatar;
                        document.getElementById('active-status').innerText = formattedTag;
                    }
                }
            } else {
                const newChannel = {
                    type: 'channel',
                    id: 'chan_' + Math.random().toString(36).substr(2, 9),
                    name,
                    username: formattedTag,
                    avatar,
                    adminId: currentUser.id
                };

                channels.push(newChannel);
                localStorage.setItem('webchat_channels', JSON.stringify(channels));
            }

            closeModals();
            renderChatsList();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text || !activeChat) return;

            if (activeChat.type === 'channel' && activeChat.adminId !== currentUser.id) {
                return alert('Тільки адміністратор може писати в цей канал!');
            }

            const msgData = {
                chatId: activeChat.id,
                sender: currentUser,
                text: sanitizeHTML(text),
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            socket.emit('chat message', msgData);
            input.value = '';
        }

        function sendFile(input) {
            const file = input.files[0];
            if (!file || !activeChat) return;

            if (activeChat.type === 'channel' && activeChat.adminId !== currentUser.id) {
                return alert('Тільки адміністратор може надсилати файли в цей канал!');
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const msgData = {
                    chatId: activeChat.id,
                    sender: currentUser,
                    image: e.target.result,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                socket.emit('chat message', msgData);
            }
            reader.readAsDataURL(file);
        }

        socket.on('chat message', (msg) => {
            if (activeChat && msg.chatId === activeChat.id) {
                appendMessage(msg);
            }
        });

        function appendMessage(msg) {
            const container = document.getElementById('messages-container');
            const el = document.createElement('div');
            const isOutgoing = msg.sender.id === currentUser.id;
            el.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            el.dataset.id = msg.id || Math.random();

            let content = '';
            if (msg.text) content += `<div>${msg.text}</div>`;
            if (msg.image) content += `<img src="${msg.image}" alt="img">`;
            
            content += `
                <div class="msg-meta">
                    <span>${msg.timestamp}</span>
                </div>
                <div class="reactions-bar" id="reactions-${el.dataset.id}">
                    <button class="add-reaction-btn" type="button" onclick="openReactionPicker(event, '${el.dataset.id}')">+</button>
                </div>
            `;
            el.innerHTML = content;
            container.appendChild(el);
            container.scrollTop = container.scrollHeight;
        }

        function openReactionPicker(e, msgId) {
            e.stopPropagation();
            selectedMsgForReaction = msgId;
            const picker = document.getElementById('reaction-picker');
            picker.style.display = 'flex';
            picker.style.top = (e.clientY - 50) + 'px';
            picker.style.left = Math.min(e.clientX, window.innerWidth - 180) + 'px';
        }

        function addReaction(emoji) {
            if (!selectedMsgForReaction) return;
            const bar = document.getElementById(`reactions-${selectedMsgForReaction}`);
            if (bar) {
                const badge = document.createElement('span');
                badge.className = 'reaction-badge';
                badge.innerHTML = `${emoji} 1`;
                bar.insertBefore(badge, bar.lastElementChild);
            }
            closeModals();
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
