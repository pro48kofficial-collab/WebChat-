<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebChat</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="auth" class="overlay"><div class="card auth-card">
  <h1>WebChat</h1><p class="muted">Твій простір для чатів і каналів</p>
  <label class="avatar-picker"><img id="regAvatar" src="https://i.imgur.com/6VBx3io.png"><span>Обрати аватар</span><input id="regFile" type="file" accept="image/*"></label>
  <input id="regUser" placeholder="@юзернейм"><input id="regNick" placeholder="Нікнейм">
  <button id="loginBtn">Увійти</button><div id="authError" class="error"></div>
</div></div>

<div id="app" class="app hidden">
  <aside id="sidebar">
    <div class="me"><img id="myAvatar"><div><b id="myNick"></b><small id="myUser"></small></div><button id="profileBtn">⚙</button></div>
    <div class="search"><input id="search" placeholder="Пошук @юзера або назви каналу"><button id="searchBtn">🔍</button></div>
    <div id="searchResult"></div>
    <div class="side-actions"><button onclick="openCreate('channel')">＋ Канал</button><button onclick="openCreate('group')">＋ Чат</button><button onclick="openShop()">💎 Магазин</button></div>
    <h5>ВАШІ ЧАТИ</h5><div id="chats"></div>
  </aside>
  <main id="main">
    <header id="header"><button id="back">←</button><div id="headerInfo">Оберіть чат</div><button id="headerMore">⋮</button></header>
    <div id="feed"><div class="empty">Оберіть чат, канал або групу</div></div>
    <div id="composer" class="composer hidden">
      <input type="file" id="attach" hidden accept="image/*,video/*">
      <button onclick="document.getElementById('attach').click()">📎</button><button id="voice">🎙️</button>
      <input id="msg" placeholder="Повідомлення..."><button id="send">➤</button>
    </div>
  </main>
</div>

<div id="modal" class="overlay hidden"><div class="modal card" id="modalContent"></div></div>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body>
</html>
