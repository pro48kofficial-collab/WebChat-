<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; }
        .screen { width: 90vw; height: 90vh; background: #1e293b; border-radius: 12px; display: flex; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        /* Auth */
        #auth-screen { justify-content: center; align-items: center; }
        .card { background: #334155; padding: 30px; border-radius: 8px; width: 350px; display: flex; flex-direction: column; gap: 15px; }
        .card input, .card button { padding: 10px; border-radius: 6px; border: none; outline: none; }
        .card input { background: #1e293b; color: white; }
        .card button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .error { color: #ef4444; font-size: 14px; }

        /* Chat Layout */
        .sidebar { width: 300px; background: #0f172a; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 15px; }
        .profile-info { display: flex; align-items: center; gap: 10px; }
        .profile-info img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .search-box { display: flex; gap: 5px; }
        .search-box input { flex: 1; padding: 8px; border-radius: 4px; border: none; background: #1e293b; color: white; }
        .search-box button { background: #3b82f6; border: none; padding: 8px 12px; border-radius: 4px; color: white; cursor: pointer; }

        .chat-area { flex: 1; display: flex; flex-direction: column; }
        #chat-header { padding: 15px; background: #334155; display: flex; justify-content: space-between; align-items: center; }
        .danger-btn { background: #ef4444; border: none; padding: 6px 12px; color: white; border-radius: 4px; cursor: pointer; }
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { background: #334155; padding: 10px; border-radius: 6px; max-width: 60%; word-break: break-word; }
        .message.me { background: #2563eb; align-self: flex-end; }
        #chat-input-area { padding: 15px; background: #334155; display: flex; gap: 10px; align-items: center; }
        #chat-input-area input[type="text"] { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #1e293b; color: white; }
        #chat-input-area button { background: #3b82f6; border: none; padding: 10px 15px; border-radius: 6px; color: white; cursor: pointer; }
    </style>
</head>
<body>
    <!-- Екран реєстрації -->
    <div id="auth-screen" class="screen">
        <div class="card">
            <h2>Реєстрація у WebChat</h2>
            <input type="text" id="reg-username" placeholder="Юзернейм (унікальний, напр. @pro)">
            <input type="text" id="reg-nickname" placeholder="Нікнейм (ім'я)">
            <input type="text" id="reg-avatar" placeholder="URL аватарки (необов'язково)">
            <button id="reg-btn">Увійти в чат</button>
            <p id="auth-error" class="error"></p>
        </div>
    </div>

    <!-- Головний екран чату -->
    <div id="chat-screen" class="screen hidden">
        <div class="sidebar">
            <div class="profile-info">
                <img id="my-avatar" src="" alt="Avatar">
                <div>
                    <h4 id="my-nickname"></h4>
                    <span id="my-username"></span>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Введіть юз для пошуку...">
                <button id="search-btn">🔍</button>
            </div>
            <div id="search-result"></div>
        </div>

        <div class="chat-area">
            <div id="chat-header" class="hidden">
                <span id="chat-with-title">Оберіть чат</span>
                <button id="block-btn" class="danger-btn">Заблокувати / Видалити чат</button>
            </div>
            <div id="messages-container"></div>
            <div id="chat-input-area" class="hidden">
                <input type="text" id="message-input" placeholder="Напишіть повідомлення (код захищено)...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentChatUser = null;

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const regBtn = document.getElementById('reg-btn');
        const authError = document.getElementById('auth-error');

        regBtn.addEventListener('click', () => {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const avatar = document.getElementById('reg-avatar').value.trim();

            if (!username || !nickname) {
                authError.textContent = 'Заповніть юзернейм та нікнейм!';
                return;
            }
            socket.emit('register', { username, nickname, avatar });
        });

        socket.on('register_error', (msg) => { authError.textContent = msg; });
        socket.on('register_success', (user) => {
            currentUser = user;
            document.getElementById('my-avatar').src = user.avatar;
            document.getElementById('my-nickname').textContent = user.nickname;
            document.getElementById('my-username').textContent = user.username;

            authScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
        });

        const searchInput = document.getElementById('search-input');
        const searchBtn = document.getElementById('search-btn');
        const searchResult = document.getElementById('search-result');

        searchBtn.addEventListener('click', () => {
            const query = searchInput.value.trim();
            if (query) socket.emit('search_user', query);
        });

        socket.on('user_found', (user) => {
            searchResult.innerHTML = `
                <div class="user-card" style="display:flex; align-items:center; gap:10px; background:#334155; padding:8px; border-radius:4px; cursor:pointer;">
                    <img src="${user.avatar}" style="width:30px; height:30px; border-radius:50%;">
                    <span>${user.nickname} (${user.username})</span>
                </div>
            `;
            searchResult.querySelector('.user-card').onclick = () => {
                currentChatUser = user.username;
                document.getElementById('chat-header').classList.remove('hidden');
                document.getElementById('chat-input-area').classList.remove('hidden');
                document.getElementById('chat-with-title').textContent = `Чат з ${user.nickname}`;
                document.getElementById('messages-container').innerHTML = '';
            };
        });

        socket.on('user_not_found', () => {
            searchResult.innerHTML = '<span style="color:red; font-size:12px;">Користувача не знайдено</span>';
        });

        // Захист від зламу кодом (екранування HTML-тегів у повідомленнях)
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesContainer = document.getElementById('messages-container');

        sendBtn.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (!text || !currentChatUser) return;

            socket.emit('send_message', { recipientUsername: currentChatUser, text });
            messageInput.value = '';
        });

        socket.on('new_message', (data) => {
            const isMe = data.sender === currentUser.username;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMe ? 'me' : ''}`;
            msgDiv.innerHTML = `<p>${escapeHtml(data.text)}</p><small style="font-size:10px; opacity:0.7;">${data.timestamp}</small>`;
            
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });

        document.getElementById('block-btn').addEventListener('click', () => {
            if (currentChatUser && confirm('Заблокувати користувача та видалити чат?')) {
                socket.emit('block_user', currentChatUser);
            }
        });

        socket.on('chat_blocked', () => {
            alert('Чат заблоковано та видалено.');
            currentChatUser = null;
            document.getElementById('chat-header').classList.add('hidden');
            document.getElementById('chat-input-area').classList.add('hidden');
            document.getElementById('messages-container').innerHTML = '';
            document.getElementById('chat-with-title').textContent = 'Оберіть чат';
        });
    </script>
</body>
    </html>
