<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebChat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0f172a; color: #f8fafc; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .screen { width: 95vw; height: 95vh; background: #1e293b; border-radius: 12px; display: flex; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .hidden { display: none !important; }

        #auth-screen { justify-content: center; align-items: center; }
        .card { background: #334155; padding: 30px; border-radius: 12px; width: 350px; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .card input, .card button { width: 100%; padding: 12px; border-radius: 8px; border: none; outline: none; }
        .card input { background: #1e293b; color: white; }
        .card button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        .card button:disabled { background: #64748b; cursor: not-allowed; }
        .avatar-picker { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .avatar-picker img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }
        .error { color: #ef4444; font-size: 14px; text-align: center; }

        .sidebar { width: 350px; background: #0f172a; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 15px; transition: 0.3s; }
        .profile-info { display: flex; align-items: center; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .user-meta { display: flex; align-items: center; gap: 10px; }
        .user-meta img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .profile-btn { background: #334155; border: none; padding: 8px 12px; border-radius: 6px; color: white; cursor: pointer; font-size: 12px; }
        
        .search-box { display: flex; gap: 5px; }
        .search-box input { flex: 1; padding: 10px; border-radius: 6px; border: none; background: #1e293b; color: white; }
        .search-box button { background: #3b82f6; border: none; padding: 10px 15px; border-radius: 6px; color: white; cursor: pointer; }

        #chats-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .chat-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 8px; cursor: pointer; background: #1e293b; transition: 0.2s; position: relative; }
        .chat-item:hover { background: #334155; }
        .chat-item img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #64748b; display: inline-block; border: 2px solid #1e293b; }
        .status-dot.online { background: #22c55e; }
        .chat-item .status-dot { position: absolute; left: 38px; bottom: 8px; }

        .chat-area { flex: 1; display: flex; flex-direction: column; background: #1e293b; transition: transform 0.3s ease; }
        #chat-header { padding: 15px; background: #334155; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { display: none; background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .danger-btn { background: #ef4444; border: none; padding: 6px 12px; color: white; border-radius: 6px; cursor: pointer; }
        
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { background: #334155; padding: 10px 14px; border-radius: 10px; max-width: 65%; word-break: break-word; position: relative; }
        .message.me { background: #2563eb; align-self: flex-end; }
        .message img { max-width: 200px; border-radius: 6px; margin-top: 5px; display: block; }
        .message a { color: #93c5fd; display: block; margin-top: 5px; font-size: 13px; }
        
        /* Меню дій та реакції */
        .msg-actions { display: none; position: absolute; right: 10px; top: 5px; background: rgba(0,0,0,0.4); border-radius: 4px; padding: 2px 5px; font-size: 12px; cursor: pointer; }
        .message:hover .msg-actions { display: inline-block; }
        .reactions-bar { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
        .reaction-badge { background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 10px; font-size: 12px; cursor: pointer; }
        
        #chat-input-area { padding: 15px; background: #334155; display: flex; gap: 10px; align-items: center; }
        #chat-input-area input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #1e293b; color: white; }
        #chat-input-area button { background: #3b82f6; border: none; padding: 12px 18px; border-radius: 8px; color: white; cursor: pointer; }
        .attach-btn { background: #475569 !important; font-size: 16px; }

        @media(max-width: 768px) {
            .screen { width: 100vw; height: 100vh; border-radius: 0; }
            .sidebar { width: 100%; position: absolute; height: 100%; z-index: 2; }
            .sidebar.hidden-mobile { transform: translateX(-100%); }
            .chat-area { width: 100%; position: absolute; height: 100%; z-index: 1; }
            .back-btn { display: block; }
        }
    </style>
</head>
<body>
    <div id="auth-screen" class="screen">
        <div class="card">
            <h2>Реєстрація у WebChat</h2>
            <label class="avatar-picker">
                <img id="preview-avatar" src="https://i.imgur.com/6VBx3io.png" alt="Аватар">
                <span style="font-size: 12px; color: #94a3b8;">Оберіть фото</span>
                <input type="file" id="reg-avatar-file" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="reg-username" placeholder="Юзернейм (напр. @pro)">
            <input type="text" id="reg-nickname" placeholder="Ваше ім'я (Нікнейм)">
            <button id="reg-btn" disabled>Підключення до сервера...</button>
            <p id="auth-error" class="error"></p>
        </div>
    </div>

    <div id="profile-screen" class="screen hidden" style="justify-content:center; align-items:center; position:absolute; z-index:10; background:rgba(15, 23, 42, 0.9);">
        <div class="card">
            <h2>Редагувати профіль</h2>
            <label class="avatar-picker">
                <img id="edit-preview-avatar" src="" alt="Аватар">
                <span style="font-size: 12px; color: #94a3b8;">Змінити фото</span>
                <input type="file" id="edit-avatar-file" accept="image/*" style="display: none;">
            </label>
            <input type="text" id="edit-username" placeholder="Юзернейм">
            <input type="text" id="edit-nickname" placeholder="Нікнейм">
            <div style="display: flex; gap: 10px; width: 100%;">
                <button id="save-profile-btn" style="background: #22c55e;">Зберегти</button>
                <button id="cancel-profile-btn" style="background: #64748b;">Назад</button>
            </div>
            <p id="profile-error" class="error"></p>
        </div>
    </div>

    <div id="chat-screen" class="screen hidden">
        <div id="sidebar" class="sidebar">
            <div class="profile-info">
                <div class="user-meta">
                    <div style="position:relative;">
                        <img id="my-avatar" src="" alt="Avatar">
                        <span id="my-status-dot" class="status-dot online"></span>
                    </div>
                    <div>
                        <h4 id="my-nickname"></h4>
                        <span id="my-username" style="font-size: 12px; color: #94a3b8;"></span>
                    </div>
                </div>
                <button id="open-profile-btn" class="profile-btn">⚙ Профіль</button>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Пошук за юзом (@...)">
                <button id="search-btn">🔍</button>
            </div>
            <div id="search-result" style="margin-bottom: 5px;"></div>
            <h5 style="color: #94a3b8; font-size: 12px; margin-top: 5px;">ВАШІ ЧАТИ</h5>
            <div id="chats-list"></div>
        </div>

        <div id="chat-area" class="chat-area">
            <div id="chat-header" class="hidden">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button id="back-btn" class="back-btn">⬅</button>
                    <div style="position:relative;">
                        <img id="chat-header-avatar" src="" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                        <span id="header-status-dot" class="status-dot"></span>
                    </div>
                    <div>
                        <span id="chat-with-title" style="font-weight: bold; display:block;">Оберіть чат</span>
                        <span id="chat-with-status" style="font-size: 11px; color: #94a3b8;"></span>
                    </div>
                </div>
                <button id="block-btn" class="danger-btn">Заблокувати</button>
            </div>
            <div id="messages-container"></div>
            <div id="chat-input-area" class="hidden">
                <input type="file" id="file-input" style="display: none;">
                <button id="attach-btn" class="attach-btn">📎</button>
                <input type="text" id="message-input" placeholder="Напишіть повідомлення...">
                <button id="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentChatUser = null;
        let base64Avatar = 'https://i.imgur.com/6VBx3io.png';
        let editBase64Avatar = '';
        let selectedFile = null;
        let editingMessageId = null;

        const regBtn = document.getElementById('reg-btn');

        setTimeout(() => {
            if (regBtn.disabled) {
                regBtn.disabled = false;
                regBtn.textContent = 'Увійти в чат';
            }
        }, 2500);

        socket.on('connect', () => {
            regBtn.disabled = false;
            regBtn.textContent = 'Увійти в чат';
            
            const savedUsername = localStorage.getItem('webchat_username');
            if (savedUsername) {
                socket.emit('register', { 
                    username: savedUsername, 
                    nickname: localStorage.getItem('webchat_nickname') || 'Користувач', 
                    avatar: localStorage.getItem('webchat_avatar') || 'https://i.imgur.com/6VBx3io.png'
                });
            }
        });

        socket.on('disconnect', () => {
            regBtn.disabled = true;
            regBtn.textContent = "З'єднання втрачено...";
        });

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 150;
                    const MAX_HEIGHT = 150;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('reg-avatar-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                compressImage(file, (compressedData) => {
                    base64Avatar = compressedData;
                    document.getElementById('preview-avatar').src = base64Avatar;
                });
            }
        });

        document.getElementById('edit-avatar-file').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                compressImage(file, (compressedData) => {
                    editBase64Avatar = compressedData;
                    document.getElementById('edit-preview-avatar').src = editBase64Avatar;
                });
            }
        });

        regBtn.addEventListener('click', () => {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            if (!username || !nickname) {
                document.getElementById('auth-error').textContent = 'Заповніть юзернейм та нікнейм!';
                return;
            }
            socket.emit('register', { username, nickname, avatar: base64Avatar });
        });

        socket.on('register_error', (msg) => { 
            document.getElementById('auth-error').textContent = msg;
            document.getElementById('profile-error').textContent = msg;
        });

        socket.on('register_success', (user) => {
            currentUser = user;
            localStorage.setItem('webchat_username', user.username);
            localStorage.setItem('webchat_nickname', user.nickname);
            localStorage.setItem('webchat_avatar', user.avatar);

            updateMyProfileUI();
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('chat-screen').classList.remove('hidden');
            loadChats();
        });

        function updateMyProfileUI() {
            document.getElementById('my-avatar').src = currentUser.avatar;
            document.getElementById('my-nickname').textContent = currentUser.nickname;
            document.getElementById('my-username').textContent = currentUser.username;
        }

        document.getElementById('open-profile-btn').addEventListener('click', () => {
            document.getElementById('edit-username').value = currentUser.username;
            document.getElementById('edit-nickname').value = currentUser.nickname;
            editBase64Avatar = currentUser.avatar;
            document.getElementById('edit-preview-avatar').src = currentUser.avatar;
            document.getElementById('profile-screen').classList.remove('hidden');
        });

        document.getElementById('cancel-profile-btn').addEventListener('click', () => {
            document.getElementById('profile-screen').classList.add('hidden');
        });

        document.getElementById('save-profile-btn').addEventListener('click', () => {
            const newUsername = document.getElementById('edit-username').value.trim();
            const nickname = document.getElementById('edit-nickname').value.trim();
            if (!newUsername || !nickname) return;

            socket.emit('update_profile', {
                oldUsername: currentUser.username,
                newUsername,
                nickname,
                avatar: editBase64Avatar
            });
        });

        socket.on('profile_updated', (user) => {
            currentUser = user;
            localStorage.setItem('webchat_username', user.username);
            localStorage.setItem('webchat_nickname', user.nickname);
            localStorage.setItem('webchat_avatar', user.avatar);

            updateMyProfileUI();
            document.getElementById('profile-screen').classList.add('hidden');
            loadChats();
            if (currentChatUser) openChat({ username: currentChatUser });
        });

        document.getElementById('attach-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    selectedFile = {
                        data: event.target.result,
                        name: file.name,
                        type: file.type
                    };
                    document.getElementById('message-input').placeholder = `Прикріплено: ${file.name}`;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('search-btn').addEventListener('click', () => {
            const query = document.getElementById('search-input').value.trim();
            if (query) socket.emit('search_user', query);
        });

        socket.on('user_found', (user) => {
            const resultDiv = document.getElementById('search-result');
            resultDiv.innerHTML = `
                <div class="chat-item" style="background:#334155; margin-top:5px;">
                    <img src="${user.avatar}">
                    <span>${user.nickname} (${user.username})</span>
                    <span class="status-dot ${user.online ? 'online' : ''}"></span>
                </div>
            `;
            resultDiv.querySelector('.chat-item').onclick = () => {
                openChat(user);
                resultDiv.innerHTML = '';
                document.getElementById('search-input').value = '';
            };
        });

        socket.on('user_not_found', () => {
            document.getElementById('search-result').innerHTML = '<span style="color:red; font-size:12px;">Не знайдено</span>';
        });

        function loadChats() {
            socket.emit('get_chats', currentUser.username);
        }

        socket.on('chats_list', (chats) => {
            const chatsList = document.getElementById('chats-list');
            chatsList.innerHTML = '';
            chats.forEach(chat => {
                if (chat.username === currentUser.username) return;
                const div = document.createElement('div');
                div.className = 'chat-item';
                div.innerHTML = `
                    <img src="${chat.avatar}">
                    <span>${chat.nickname} (${chat.username})</span>
                    <span class="status-dot ${chat.online ? 'online' : ''}" id="status-${chat.username}"></span>
                `;
                div.onclick = () => openChat(chat);
                chatsList.appendChild(div);
            });
        });

        socket.on('status_update', (data) => {
            const dot = document.getElementById(`status-${data.username}`);
            if (dot) {
                if (data.online) dot.classList.add('online');
                else dot.classList.remove('online');
            }
            if (currentChatUser === data.username) {
                const headerDot = document.getElementById('header-status-dot');
                const statusText = document.getElementById('chat-with-status');
                if (data.online) {
                    headerDot.classList.add('online');
                    statusText.textContent = 'В мережі';
                } else {
                    headerDot.classList.remove('online');
                    statusText.textContent = 'Не в мережі';
                }
            }
        });

        function openChat(user) {
            currentChatUser = user.username;
            document.getElementById('chat-header').classList.remove('hidden');
            document.getElementById('chat-input-area').classList.remove('hidden');
            document.getElementById('chat-with-title').textContent = user.nickname || user.username;
            document.getElementById('chat-header-avatar').src = user.avatar || 'https://i.imgur.com/6VBx3io.png';
            
            const headerDot = document.getElementById('header-status-dot');
            const statusText = document.getElementById('chat-with-status');
            if (user.online) {
                headerDot.classList.add('online');
                statusText.textContent = 'В мережі';
            } else {
                headerDot.classList.remove('online');
                statusText.textContent = 'Не в мережі';
            }

            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.add('hidden-mobile');
            }

            socket.emit('get_messages', { user1: currentUser.username, user2: currentChatUser });
        }

        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.remove('hidden-mobile');
            loadChats();
        });

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const messagesContainer = document.getElementById('messages-container');

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        function sendMessage() {
            const text = messageInput.value.trim();
            if ((!text && !selectedFile) || !currentChatUser) return;

            if (editingMessageId) {
                socket.emit('edit_message', { id: editingMessageId, newText: text, user: currentUser.username });
                editingMessageId = null;
                messageInput.value = '';
                return;
            }

            socket.emit('send_message', {
                sender: currentUser.username,
                recipient: currentChatUser,
                text: text,
                fileData: selectedFile ? selectedFile.data : null,
                fileName: selectedFile ? selectedFile.name : null
            });

            messageInput.value = '';
            messageInput.placeholder = 'Напишіть повідомлення...';
            selectedFile = null;
        }

        socket.on('chat_history', (messages) => {
            messagesContainer.innerHTML = '';
            messages.forEach(msg => appendMessage(msg));
        });

        socket.on('new_message', (data) => {
            if (data.sender === currentChatUser || data.recipient === currentChatUser) {
                appendMessage(data);
            }
            loadChats();
        });

        socket.on('message_updated', (data) => {
            const el = document.getElementById(`msg-${data.id}`);
            if (el) {
                const textEl = el.querySelector('.msg-text');
                if (textEl) textEl.textContent = data.text + (data.edited ? ' (ред.)' : '');
                
                // Оновлюємо блок реакцій
                let reactionsContainer = el.querySelector('.reactions-bar');
                if (!reactionsContainer) {
                    reactionsContainer = document.createElement('div');
                    reactionsContainer.className = 'reactions-bar';
                    el.appendChild(reactionsContainer);
                }
                reactionsContainer.innerHTML = '';
                for (let [u, emoji] of Object.entries(data.reactions || {})) {
                    const badge = document.createElement('span');
                    badge.className = 'reaction-badge';
                    badge.textContent = emoji;
                    reactionsContainer.appendChild(badge);
                }
            }
        });

        socket.on('message_deleted', (data) => {
            const el = document.getElementById(`msg-${data.id}`);
            if (el) el.remove();
        });

        function appendMessage(data) {
            const isMe = data.sender === currentUser.username;
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isMe ? 'me' : ''}`;
            msgDiv.id = `msg-${data.id}`;
            
            let content = `<div class="msg-text">${escapeHtml(data.text)}${data.edited ? ' <span style="font-size:10px; opacity:0.6;">(ред.)</span>' : ''}</div>`;
            
            if (data.fileData) {
                if (data.fileData.startsWith('data:image/')) {
                    content += `<img src="${data.fileData}" alt="Фото">`;
                } else {
                    content += `<a href="${data.fileData}" download="${data.fileName}">📄 ${escapeHtml(data.fileName)}</a>`;
                }
            }

            // Блок реакцій, якщо вони є
            content += `<div class="reactions-bar">`;
            if (data.reactions) {
                for (let [u, emoji] of Object.entries(data.reactions)) {
                    content += `<span class="reaction-badge">${emoji}</span>`;
                }
            }
            content += `</div>`;

            content += `<div style="display:flex; justify-content:flex-end; align-items:center; gap:5px; margin-top:4px;">`;
            content += `<span style="font-size:10px; opacity:0.7;">${data.timestamp}</span>`;
            content += `</div>`;

            // Кнопки дій (редагувати, видалити, реакції) доступні при наведенні
            content += `<div class="msg-actions">
                <span onclick="addReaction('${data.id}', '❤️')">❤️</span>
                <span onclick="addReaction('${data.id}', '👍')">👍</span>
                <span onclick="addReaction('${data.id}', '😂')">😂</span>`;
            
            if (isMe) {
                content += ` <span onclick="editMsg('${data.id}', \`${escapeHtml(data.text)}\`)">✏️</span>`;
                content += ` <span onclick="deleteMsg('${data.id}')">🗑️</span>`;
            }
            content += `</div>`;

            msgDiv.innerHTML = content;
            messagesContainer.appendChild(msgDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        window.addReaction = (id, emoji) => {
            socket.emit('add_reaction', { id, emoji, user: currentUser.username });
        };

        window.editMsg = (id, currentText) => {
            editingMessageId = id;
            messageInput.value = currentText;
            messageInput.focus();
        };

        window.deleteMsg = (id) => {
            if (confirm('Видалити повідомлення?')) {
                socket.emit('delete_message', { id, user: currentUser.username });
            }
        };

        document.getElementById('block-btn').addEventListener('click', () => {
            if (currentChatUser && confirm('Заблокувати чат?')) {
                socket.emit('block_user', { user1: currentUser.username, user2: currentChatUser });
            }
        });

        socket.on('chat_blocked', () => {
            alert('Чат було заблоковано.');
            currentChatUser = null;
